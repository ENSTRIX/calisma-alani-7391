            "<select class='vq-sel' data-ders='" + esc(item.ders) + "' data-key='" + esc(item.key) + "' data-id='" + esc(v.id) + "'>" +
            "<option value='?'" + (item.konu === "?" ? " selected" : "") + ">Sınıflanmayan</option>" +
            units.map(u => "<option value='" + esc(u) + "'" + (u === item.konu ? " selected" : "") + ">" + esc(u) + "</option>").join("") +
            "</select>" +
            (!v.w && !V_SELECT_MODE ? "<button class='tb vq-today' data-key='" + esc(item.key) + "' data-id='" + esc(v.id) + "' style='padding:3px 8px;font-size:11.5px;color:var(--ok);border-color:var(--ok)'>Bugün İzledim</button>" : "") +
            "</div></div>" +
            "<div class='u-act'>" +
            "<button class='tb vq-edit' data-id='" + esc(v.id) + "' title='İsmi düzenle'>✎</button>" +
            (VD_FILTER_DERS !== "ALL"
              ? "<button class='tb vq-up' data-q='" + qIdx + "' title='Yukarı'>↑</button><button class='tb vq-dn' data-q='" + qIdx + "' title='Aşağı'>↓</button>"
              : "") +
            "<button class='x vq-del' data-key='" + esc(item.key) + "' data-id='" + esc(v.id) + "' title='Sil'>✕</button>" +
            "</div></div>";
        }).join("")
      : "<div class='e'>" + (allVideos.length ? "Bu filtrede video yok." : "Henüz video eklenmedi. Yukarıdan YouTube oynatma listesi ekleyebilirsin.") + "</div>";

    const listCard = "<div class='c'>" +
      "<h2>Video Listesi · " + watchedCount + "/" + allVideos.length + " izlendi (%" + pctDone + ")</h2>" +
      subjectFilterChips +
      gapAlert +
      (allVideos.length
        ? "<div class='bar' style='margin:8px 0'><i style='width:" + pctDone + "%;background:linear-gradient(90deg,var(--ac),var(--ac2))'></i></div>" +
          "<div class='chips'>" +
          "<button class='tb vfl' data-f='all' style='" + (VF === "all" ? "border-color:var(--ac);color:var(--ac)" : "") + "'>Tümü (" + allVideos.length + ")</button>" +
          "<button class='tb vfl' data-f='unwatched' style='" + (VF === "unwatched" ? "border-color:var(--ac);color:var(--ac)" : "") + "'>Eksikler (" + unwatchedCount + ")</button>" +
          "<button class='tb vfl' data-f='today' style='" + (VF === "today" ? "border-color:var(--ok);color:var(--ok)" : "") + "'>Bugün İzlenenler (" + todayCount + ")</button>" +
          "<button class='tb vfl' data-f='watched' style='" + (VF === "watched" ? "border-color:var(--ac2);color:var(--ac2)" : "") + "'>İzlenenler (" + watchedCount + ")</button>" +
          "</div>" +
          toolsBar +
          bulkActionBar
        : "") +
      "<div style='margin-top:6px'>" + queueRows + "</div>" +
      (allVideos.length && !V_SELECT_MODE
        ? "<div style='margin-top:12px;display:flex;justify-content:flex-end'><button class='tb danger-btn cl' data-k='" + esc(VD_FILTER_DERS) + "'>" +
          (VD_FILTER_DERS === "ALL" ? "🗑️ Tüm Videoları Temizle" : "🗑️ " + esc(VD_FILTER_DERS) + " Videolarını Sil") +
          "</button></div>"
        : "") +
      "</div>";

    $("#v").innerHTML = nextCard + importCard + listCard;

    const v = $("#v");
    $("#vd").onchange = () => { VD_ADD_DERS = $("#vd").value; };
    v.querySelectorAll(".vdk").forEach(b => b.onclick = () => { VD_FILTER_DERS = b.dataset.k; V_SELECTED.clear(); vVid(); });
    v.querySelectorAll(".vfl").forEach(b => b.onclick = () => { VF = b.dataset.f; vVid(); });

    v.querySelectorAll(".add-gap-vid").forEach(b => b.onclick = () => keep(() => {
      const k = b.dataset.ders, konu = b.dataset.konu || cls(k, b.dataset.title);
      const bucket = S.vd[k + "|" + konu] || (S.vd[k + "|" + konu] = []);
      bucket.push({
        id: uid(),
        t: b.dataset.title,
        rt: b.dataset.title,
        w: 0,
        vid: "",
        dur: "",
        pl: "",
        ord: Number(b.dataset.ord) || 1,
        wd: ""
      });
      save();
      showToast("✓ \"" + b.dataset.title + "\" eklendi");
    }));

    const addVideosToState = (k, plLabel, rawItems) => {
      const existing = getVideos(k);
      const byVid = new Map();
      const byTitle = new Set();
      let maxOrd = existing.reduce((m, x) => Math.max(m, typeof x.v.ord === "number" ? x.v.ord : 0), 0);

      existing.forEach(x => {
        if (x.v.vid) byVid.set(x.v.vid, x.v);
        byTitle.add(x.v.t);
      });

      const prepared = rawItems.map((it, i) => ({
        rt: it.t,
        t: cleanVideoTitle(it.t),
        vid: it.vid || "",
        dur: it.dur || "",
        srcIdx: typeof it.idx === "number" ? it.idx : (i + 1)
      }));
      applySeriesNumbering(prepared);

      let added = 0, unmatched = 0;
      prepared.forEach(it => {
        if (it.vid && byVid.has(it.vid)) {
          const old = byVid.get(it.vid);
          if (!old.dur && it.dur) old.dur = it.dur;
          if (!old.pl && plLabel) old.pl = plLabel;
          return;
        }
        if (!it.vid && byTitle.has(it.t)) return;
        byTitle.add(it.t);
        maxOrd++;
        const c = cls(k, it.t);
        const bucket = S.vd[k + "|" + c] || (S.vd[k + "|" + c] = []);
        bucket.push({
          id: uid(),
          t: it.t,
          rt: it.rt,
          w: 0,
          vid: it.vid,
          dur: it.dur,
          pl: plLabel || "",
          ord: maxOrd,
          wd: ""
        });
        added++;
        if (c === "?") unmatched++;
      });
      return { added, unmatched };
    };

    if ($("#vf-btn")) {
      $("#vf-btn").onclick = async () => {
        const url = $("#vurl").value.trim();
        const k = $("#vd").value;
        const plCustom = $("#vpl").value.trim();
        if (!url) {
          $("#vm").textContent = "Lütfen bir YouTube oynatma listesi linki yapıştır.";
          return;
        }
        $("#vf-btn").disabled = true;
        $("#vf-btn").textContent = "Çekiliyor…";
        $("#vm").textContent = "Oynatma listesi kontrol ediliyor (en fazla 5 sn)…";
        try {
          const res = await fetchYoutubePlaylist(url);
          const label = plCustom || (res.plTitle ? cleanVideoTitle(res.plTitle) : "");
          const { added, unmatched } = addVideosToState(k, label, res.videos);
          VD_ADD_DERS = k;
          VD_FILTER_DERS = k;
          save();
          vVid();
          const msgEl = $("#vm");
          if (msgEl) {
            msgEl.textContent = added
              ? added + " video sadeleştirilip sırayla eklendi ✓" + (unmatched ? " (" + unmatched + " tanesi Sınıflanmayan altında)" : "")
              : "Listedeki tüm videolar zaten ekli.";
          }
        } catch (err) {
          $("#vf-btn").disabled = false;
          $("#vf-btn").textContent = "Listeyi Çek";
          VM = "text";
          const det = $("#v").querySelector("details");
          if (det) det.open = true;
          $("#vm").innerHTML = "<span class='wn'>" + esc(err.message || "Liste çekilemedi.") + "</span>";
        }
      };
    }

    if ($("#va")) {
      $("#va").onclick = () => {
        const k = $("#vd").value;
        const plLabel = $("#vpl").value.trim();
        const rawLines = $("#vt").value.split("\n").map(x => x.trim()).filter(Boolean);
        const items = [];

        for (let i = 0; i < rawLines.length; i++) {
          const line = rawLines[i];
          if (/^\d{1,2}(:\d{2}){1,2}$/.test(line)) {
            if (items.length && !items[items.length - 1].dur) {
              items[items.length - 1].dur = line;
            }
            continue;
          }
          if (/^\d+$/.test(line)) continue;
          if (/^(şimdi oynatılıyor|oynatılıyor|tümünü oynat|karıştır|abone ol|paylaş|kaydet|görüntüleme|bölüm|önce|gün önce|ay önce|yıl önce|benim hocam|ramazan yetgin|ilyas güneş|kadir gümüş|bayram meral|engin eraydın|esra özkan karaoğlu)$/i.test(line)) continue;
          if (/^\d+[\.,]?\d*\s*(?:b|mn|bin|milyon)?\s*görüntüleme/i.test(line)) continue;
          if (line.length < 5) continue;

          const durMatch = line.match(/\s+(\d{1,2}:\d{2}(?::\d{2})?)$/);
          const dur = durMatch ? durMatch[1] : "";
          const cleaned = line.replace(/\s+\d{1,2}:\d{2}(?::\d{2})?$/, "").trim();
          if (cleaned.length >= 4) {
            items.push({ t: cleaned, vid: "", dur, idx: items.length + 1 });
          }
        }

        const { added, unmatched } = addVideosToState(k, plLabel, items);
        if (!added) {
          $("#vm").textContent = "Eklenecek yeni video başlığı bulunamadı.";
          return;
        }
        VD_ADD_DERS = k;
        VD_FILTER_DERS = k;
        save();
        vVid();
        const msgEl = $("#vm");
        if (msgEl) {
          msgEl.textContent = added + " video sadeleştirilip sırayla eklendi ✓" + (unmatched ? " (" + unmatched + " tanesi Sınıflanmayan altında)" : "");
        }
      };
    }

    if ($("#v-clean-all")) {
      $("#v-clean-all").onclick = () => keep(() => {
        const cnt = simplifyAllVideos(VD_FILTER_DERS);
        save();
        showToast(cnt ? cnt + " video ismi sadeleştirildi ✓" : "Tüm video isimleri zaten sade");
      });
    }

    if ($("#v-restore-all")) {
      $("#v-restore-all").onclick = () => keep(() => {
        restoreRawVideoTitles(VD_FILTER_DERS);
        save();
      });
    }

    if ($("#v-sel-toggle")) {
      $("#v-sel-toggle").onclick = () => {
        V_SELECT_MODE = !V_SELECT_MODE;
        V_SELECTED.clear();
        vVid();
      };
    }

    if ($("#v-sel-all")) {
      $("#v-sel-all").onclick = () => {
        if (V_SELECTED.size === filteredQueue.length) {
          V_SELECTED.clear();
        } else {
          filteredQueue.forEach(x => V_SELECTED.add(x.v.id));
        }
        vVid();
      };
    }

    v.querySelectorAll(".sel-chk").forEach(chk => chk.onchange = () => {
      if (chk.checked) V_SELECTED.add(chk.dataset.id);
      else V_SELECTED.delete(chk.dataset.id);
      vVid();
    });

    if ($("#v-del-sel")) {
      $("#v-del-sel").onclick = () => keep(() => {
        Object.keys(S.vd).forEach(key => {
          S.vd[key] = (S.vd[key] || []).filter(item => !V_SELECTED.has(item.id));
        });
        V_SELECTED.clear();
        V_SELECT_MODE = false;
        save();
      });
    }

    if ($("#v-del-unw")) {
      $("#v-del-unw").onclick = () => keep(() => {
        const targetIds = new Set(allVideos.filter(x => !x.v.w).map(x => x.v.id));
        Object.keys(S.vd).forEach(key => {
          S.vd[key] = (S.vd[key] || []).filter(item => !targetIds.has(item.id));
        });
        V_SELECTED.clear();
        V_SELECT_MODE = false;
        save();
      });
    }

    if ($("#v-del-all")) {
      $("#v-del-all").onclick = () => keep(() => {
        if (VD_FILTER_DERS === "ALL") {
          S.vd = {};
        } else {
          Object.keys(S.vd).filter(x => x.startsWith(VD_FILTER_DERS + "|")).forEach(x => delete S.vd[x]);
        }
        V_SELECTED.clear();
        V_SELECT_MODE = false;
        save();
      });
    }

    if ($("#v-next-done") && nextItem) {
      $("#v-next-done").onclick = () => keep(() => {
        markVideoWatched(nextItem, true);
        save();
      });
    }

    v.querySelectorAll(".vq-chk").forEach(chk => chk.onchange = () => keep(() => {
      const arr = S.vd[chk.dataset.key] || [];
      const video = arr.find(x => x.id === chk.dataset.id);
      if (!video) return;
      const ders = chk.dataset.key.split("|")[0];
      const konu = chk.dataset.key.split("|")[1];
      markVideoWatched({ ders, konu, v: video }, chk.checked);
      save();
    }));

    v.querySelectorAll(".vq-today").forEach(btn => btn.onclick = () => keep(() => {
      const arr = S.vd[btn.dataset.key] || [];
      const video = arr.find(x => x.id === btn.dataset.id);
      if (!video) return;
      const ders = btn.dataset.key.split("|")[0];
      const konu = btn.dataset.key.split("|")[1];
      markVideoWatched({ ders, konu, v: video }, true);
      save();
    }));

    v.querySelectorAll(".vq-edit").forEach(btn => btn.onclick = () => {
      V_EDIT_ID = (V_EDIT_ID === btn.dataset.id) ? "" : btn.dataset.id;
      vVid();
    });

    v.querySelectorAll(".vq-ed-ok").forEach(btn => btn.onclick = () => keep(() => {
      const arr = S.vd[btn.dataset.key] || [];
      const video = arr.find(x => x.id === btn.dataset.id);
      const inp = v.querySelector(".vq-ed-inp[data-id='" + btn.dataset.id + "']");
      if (video && inp && inp.value.trim()) {
        video.t = inp.value.trim();
        save();
      }
      V_EDIT_ID = "";
    }));

    v.querySelectorAll(".vq-sel").forEach(sel => sel.onchange = () => keep(() => {
      const oldKey = sel.dataset.key;
      const newKey = sel.dataset.ders + "|" + sel.value;
      if (oldKey === newKey) return;
      const arr = S.vd[oldKey] || [];
      const idx = arr.findIndex(x => x.id === sel.dataset.id);
      if (idx === -1) return;
      const moved = arr.splice(idx, 1)[0];
      if (moved) {
        (S.vd[newKey] = S.vd[newKey] || []).push(moved);
        save();
      }
    }));

    v.querySelectorAll(".vq-up").forEach(btn => btn.onclick = () => keep(() => {
      const qIdx = +btn.dataset.q;
      if (qIdx <= 0) return;
      const cur = filteredQueue[qIdx].v, prev = filteredQueue[qIdx - 1].v;
      const tmp = cur.ord;
      cur.ord = prev.ord;
      prev.ord = tmp;
      save();
    }));

    v.querySelectorAll(".vq-dn").forEach(btn => btn.onclick = () => keep(() => {
      const qIdx = +btn.dataset.q;
      if (qIdx >= filteredQueue.length - 1) return;
      const cur = filteredQueue[qIdx].v, next = filteredQueue[qIdx + 1].v;
      const tmp = cur.ord;
      cur.ord = next.ord;
      next.ord = tmp;
      save();
    }));

    v.querySelectorAll(".vq-del").forEach(btn => btn.onclick = () => keep(() => {
      const arr = S.vd[btn.dataset.key] || [];
      S.vd[btn.dataset.key] = arr.filter(x => x.id !== btn.dataset.id);
      save();
    }));

    v.querySelectorAll(".cl").forEach(b => b.onclick = () => {
      const k = b.dataset.k;
      if (k === "ALL") {
        S.vd = {};
      } else {
        Object.keys(S.vd).filter(x => x.startsWith(k + "|")).forEach(x => delete S.vd[x]);
      }
      save();
      render();
    });
  }

  /* ==========================================================================
     13. ODAK MODU (POMODORO, GERİ SAYIM, KRONOMETRE + DERS SEÇİMİ)
     ========================================================================== */
  const TM = { m: "pom", run: false, t0: 0, acc: 0, ph: "w", cm: 30 };
  const tdur = () => TM.m === "pom" ? (TM.ph === "w" ? 1500 : 300) : TM.cm * 60;
  const tel = () => TM.acc + (TM.run ? (Date.now() - TM.t0) / 1000 : 0);

  function fmt(s) {
    s = Math.max(0, Math.floor(s));
    return pad(Math.floor(s / 60)) + ":" + pad(s % 60);
  }

  function logF(min) {
    if (min >= 1) {
      S.fs.push({ id: uid(), date: ds(new Date()), min: Math.round(min), ders: FOCUS_DERS || "" });
      save();
    }
  }

  function beep() {
    try {
      const Ctx = window.AudioContext || window.webkitAudioContext;
      if (Ctx) {
        const a = new Ctx(), o = a.createOscillator();
        o.connect(a.destination);
        o.frequency.value = 880;
        o.start();
        setTimeout(() => o.stop(), 400);
      }
    } catch (e) {}
    try {
      if (navigator.vibrate) navigator.vibrate(300);
    } catch (e) {}
  }

  function tfin() {
    beep();
    if (TM.m === "cd" || (TM.m === "pom" && TM.ph === "w")) logF(tdur() / 60);
    if (TM.m === "pom") TM.ph = TM.ph === "w" ? "b" : "w";
    TM.run = false;
    TM.acc = 0;
    if (tab === "odak") vOdak();
  }

  function tdraw() {
    const el = $("#tm"), tr = $("#tr");
    if (!el || !tr) return;
    const e = tel(), d = tdur(), sw = TM.m === "sw";
    const p = sw ? (e % 3600) / 3600 * 100 : Math.min(100, e / d * 100);
    el.textContent = fmt(sw ? e : d - e);
    tr.style.strokeDasharray = (553 * p / 100) + " 553";
  }

  setInterval(() => {
    if (!TM.run) return;
    if (TM.m !== "sw" && tel() >= tdur()) {
      tfin();
      return;
    }
    tdraw();
  }, 500);

  function vOdak() {
    const t0 = ds(new Date()), modes = [["pom", "Pomodoro"], ["cd", "Geri sayım"], ["sw", "Kronometre"]];
    const dk = Object.keys(S.ders);
    $("#v").innerHTML = "<div class='c'><h2>Odak modu</h2>" +
      "<div class='seg'>" + modes.map(m => "<button class='" + (TM.m === m[0] ? "on" : "") + "' data-m='" + m[0] + "'>" + m[1] + "</button>").join("") + "</div>" +
      "<div class='ctl' style='margin-bottom:8px'><select id='f-ders'><option value=''>Genel Çalışma (Ders seçimi isteğe bağlı)</option>" +
      dk.map(k => "<option value='" + esc(k) + "'" + (FOCUS_DERS === k ? " selected" : "") + ">" + esc(k) + "</option>").join("") +
      "</select></div>" +
      "<div class='clock'><svg viewBox='0 0 200 200'>" +
      "<circle cx='100' cy='100' r='88' fill='none' stroke-width='10' style='stroke:var(--bd)'/>" +
      "<circle id='tr' cx='100' cy='100' r='88' fill='none' stroke-width='10' stroke-linecap='round' transform='rotate(-90 100 100)' stroke-dasharray='0 553' style='stroke:" + (TM.m === "pom" && TM.ph === "b" ? "var(--ok)" : "var(--ac)") + "'/>" +
      "</svg><div><b id='tm'>00:00</b><small>" + (TM.m === "pom" ? (TM.ph === "w" ? "Odak (25 dk)" : "Mola (5 dk)") : TM.m === "cd" ? "Geri sayım" : "Süre") + "</small></div></div>" +
      (TM.m === "cd" ? "<div class='chips' style='justify-content:center'>" + [15, 25, 45, 60, 90].map(x => "<button class='tb cmb' data-v='" + x + "' style='" + (TM.cm === x ? "border-color:var(--ac);color:var(--ac)" : "") + "'>" + x + " dk</button>").join("") + "</div>" : "") +
      "<div class='ctl'>" +
      "<button class='pb' id='ts'>" + (TM.run ? "Duraklat" : "Başlat") + "</button>" +
      "<button class='tb' id='tf'>Bitir ve kaydet</button>" +
      "<button class='tb' id='tz'>Sıfırla</button>" +
      "</div></div>" +
      "<div class='c'><h2>İstatistik</h2>" +
      "<div class='g' style='grid-template-columns:repeat(3,1fr)'>" +
      "<div><b>" + Math.round(fmin(t0)) + "</b><span>Bugün (dk)</span></div>" +
      "<div><b>" + Math.round(fmin(dAgo(6))) + "</b><span>7 gün (dk)</span></div>" +
      "<div><b>" + S.fs.length + "</b><span>Oturum</span></div>" +
      "</div></div>";

    const v = $("#v");

  /* Denemeler */
  function denChart(X, nt) {
    const V = X.slice(-12), vs = V.map(nt), mn = Math.min(...vs), mx2 = Math.max(...vs);
    const W = 300, H = 120, pd = 22, avg = vs.reduce((a, b) => a + b, 0) / vs.length;
    const xx = i => pd + i * (W - 2 * pd) / Math.max(1, V.length - 1);
    const yy = v => H - pd - (v - mn) / ((mx2 - mn) || 1) * (H - 2 * pd);

    return "<svg viewBox='0 0 " + W + " " + H + "' style='width:100%'>" +
      "<line x1='" + pd + "' x2='" + (W - pd) + "' y1='" + yy(avg) + "' y2='" + yy(avg) + "' stroke-dasharray='4 4' style='stroke:var(--mu)'/>" +
      "<polyline points='" + vs.map((v, i) => xx(i) + "," + yy(v)).join(" ") + "' fill='none' stroke-width='3' stroke-linejoin='round' style='stroke:var(--ac)'/>" +
      vs.map((v, i) =>
        "<circle cx='" + xx(i) + "' cy='" + yy(v) + "' r='4' style='fill:var(--ac2)'/>" +
        (V.length <= 8 || i === V.length - 1 ? "<text x='" + xx(i) + "' y='" + (yy(v) - 8) + "' text-anchor='middle' font-size='10' style='fill:var(--tx)'>" + f(v) + "</text>" : "")
      ).join("") +
      "<text x='" + pd + "' y='" + (H - 4) + "' font-size='9' style='fill:var(--mu)'>" + dm(V[0].date) + "</text>" +
      "<text x='" + (W - pd) + "' y='" + (H - 4) + "' text-anchor='end' font-size='9' style='fill:var(--mu)'>" + dm(V[V.length - 1].date) + "</text>" +
      "<text x='" + (W - pd) + "' y='" + (yy(avg) - 4) + "' text-anchor='end' font-size='9' style='fill:var(--mu)'>ort " + f(avg) + "</text>" +
      "</svg>";
  }

  function denAnaliz() {
    const G = srt(S.ex.filter(e => !e.tp || e.tp === "genel"));
    if (!G.length) return "";
    const dk = Object.keys(S.ders);
    const rn = (e, k) => { const r = e.r[k] || [0, 0]; return r[0] - r[1] / 4; };
    const nt = e => Object.keys(e.r || {}).reduce((s, k) => s + rn(e, k), 0);

    const L = G[G.length - 1], P = G.length > 1 ? G[G.length - 2] : null;
    const dif = P ? nt(L) - nt(P) : 0;
    const avg = G.reduce((s, e) => s + nt(e), 0) / G.length;
    const best = G.reduce((a, e) => nt(e) > nt(a) ? e : a, G[0]);

    const rows = dk.filter(k => L.r[k]).map(k => {
      const r = L.r[k] || [0, 0], n = rn(L, k);
      const av = G.reduce((s, e) => s + rn(e, k), 0) / G.length;
      const ac = r[0] + r[1] ? r[0] / (r[0] + r[1]) * 100 : 0;
      return "<div class='row'><span>" + esc(k) + "</span><small>" + r[0] + "D " + r[1] + "Y " + (r[2] || 0) + "B · net <b>" + f(n) + "</b> " + (P ? ar(n, rn(P, k), true) : "") + " · ort " + f(av) + " · %" + Math.round(ac) + "</small></div>";
    }).join("");

    const ins = ["Ortalama net " + f(avg) + ", en yüksek " + f(nt(best)) + " (" + esc(best.name || dm(best.date)) + "), son deneme " + f(nt(L)) + "."];
    if (P) ins.push("Son deneme öncekine göre " + (dif >= 0 ? "+" : "") + f(dif) + " net.");
    if (L.p) ins.push("Son deneme puanın " + L.p + "; hedefin " + S.cfg.goal + (L.p < S.cfg.goal ? ", " + f(S.cfg.goal - L.p) + " puan kaldı." : ", hedefi geçtin!"));

    return "<div class='c'><h2>Son deneme · " + esc(L.name || "Deneme") + " · " + dm(L.date) + "</h2>" +
      "<div class='kp'><div><b class='ac'>" + f(nt(L)) + "</b><small>Net</small></div><div><b>" + (L.p || "–") + "</b><small>Puan</small></div><div><b>" + (P ? (dif >= 0 ? "+" : "") + f(dif) : "–") + "</b><small>Fark</small></div><div><b>" + f(avg) + "</b><small>Ortalama</small></div></div>" +
      rows + "</div>" +
      "<div class='c'><h2>Net gelişimi · son " + Math.min(12, G.length) + " deneme</h2>" + denChart(G, nt) + "</div>" +
      "<div class='c'><h2>Yorumlar</h2>" + ins.map(t => "<p class='ins'>• " + t + "</p>").join("") + "</div>";
  }

  });

  function shrink(file, m = 1200, q = 0.75) {
    return new Promise((res, rej) => {
      const u = URL.createObjectURL(file), im = new Image();
      im.onload = () => {
        const s = Math.min(1, m / Math.max(im.width, im.height));
        const c = document.createElement("canvas");
        c.width = Math.round(im.width * s);
        c.height = Math.round(im.height * s);
        c.getContext("2d").drawImage(im, 0, 0, c.width, c.height);
        URL.revokeObjectURL(u);
        c.toBlob(b => b ? res(b) : rej(new Error("Görsel küçültülemedi")), "image/jpeg", q);
      };
      im.onerror = rej;
      im.src = u;
    });
  }

      "<div style='height:12px'></div><button class='pb' id='hv'>Deftere ekle</button></div>" +
      "<div class='c'><h2>Defter · " + pend + " hata tekrar bekliyor</h2>" +
      "<div class='ctl'><select id='hf'><option value=''>Tüm dersler</option>" + dk.map(k => "<option value='" + esc(k) + "'" + (k === HF ? " selected" : "") + ">" + esc(k) + "</option>").join("") + "</select>" +
      "<label class='vi' style='border:0;padding:0;align-items:center;white-space:nowrap'><input type='checkbox' id='ho'" + (HO ? " checked" : "") + "><span>Sadece bekleyenler</span></label></div>" +
      (L.length
        ? L.map(h =>
            "<div class='li' style='align-items:flex-start;flex-direction:column'><div style='width:100%'>" +
            "<b>" + esc(h.konu) + "</b>" +
            "<small>" + h.date + " · " + esc(h.ders) + " · " + esc(h.t) + (h.n ? " · " + h.n + " tekrar" : "") + (h.ok ? " · ✓ öğrenildi" : "") + "</small>" +
            (h.q ? "<div class='hc'>" + esc(h.q) + "</div>" : "") +
            (h.a ? "<div class='hc ok'>" + esc(h.a) + "</div>" : "") +
            (h.img ? "<img src='" + (h.img.startsWith("data:") ? h.img : "/_blob/" + h.img) + "' alt='soru fotoğrafı' style='max-width:100%;border-radius:10px;margin-top:6px'>" : "") +
            (h.img2 ? "<small class='st' style='display:block;margin-top:8px'>Çözüm</small><img src='" + (h.img2.startsWith("data:") ? h.img2 : "/_blob/" + h.img2) + "' alt='çözüm fotoğrafı' style='max-width:100%;border-radius:10px;margin-top:4px'>" : "") +
            "</div><div class='hb'>" +
            "<button class='tb hr' data-i='" + h.id + "'>Tekrar ettim</button>" +
            "<button class='tb ht2' data-i='" + h.id + "'>" + (h.ok ? "Geri al" : "Öğrendim ✓") + "</button>" +
            "<button class='tb hx' data-i='" + h.id + "'>Sil</button>" +
            "</div></div>"
          ).join("")
        : "<div class='e'>Kayıt yok.</div>") +
      "</div>";

    const fill = () => {
      const units = S.ders[$("#hs").value] || [];
      $("#hk").innerHTML = units.length
        ? units.map(k => "<option value='" + esc(k) + "'>" + esc(k) + "</option>").join("")
        : "<option value='Genel'>Genel</option>";
    };
    fill();
    $("#hs").onchange = fill;

    $("#hv").onclick = async () => {
      const q = $("#hq").value.trim(), a = $("#ha").value.trim();
      const pf = $("#hp") && $("#hp").files[0], pf2 = $("#hp2") && $("#hp2").files[0];
      if (!q && !a && !pf && !pf2) return;
      let img = "", img2 = "";
      if (pf) {
        try {
          $("#hv").textContent = "Yükleniyor…";
          img = await upl(pf);
        } catch (e) {
          $("#hv").textContent = "Fotoğraf eklenemedi";
          return;
        }
      }
      if (pf2) {
        try {
          $("#hv").textContent = "Yükleniyor…";
          img2 = await upl(pf2);
        } catch (e) {
          $("#hv").textContent = "Fotoğraf eklenemedi";
          return;
        }
      }
      S.hd.push({
        id: uid(),
        date: ds(new Date()),
        ders: $("#hs").value,
        konu: $("#hk").value || "Genel",
        t: $("#ht").value,
        q,
        a,
        img,
        img2,
        ok: 0,
        n: 0
      });
      save();
      render();
    };

    $("#hf").onchange = () => { HF = $("#hf").value; vHata(); };
    $("#ho").onchange = () => { HO = $("#ho").checked; vHata(); };
    const v = $("#v"), fh = b => S.hd.find(x => x.id === b.dataset.i);
    v.querySelectorAll(".hr").forEach(b => b.onclick = () => keep(() => { const h = fh(b); h.n = (h.n || 0) + 1; save(); }));
    v.querySelectorAll(".ht2").forEach(b => b.onclick = () => keep(() => { const h = fh(b); h.ok = h.ok ? 0 : 1; save(); }));
    v.querySelectorAll(".hx").forEach(b => b.onclick = () => {
      const h = fh(b);
      if (h && AS) {
        [h.img, h.img2].forEach(x => { if (x && !x.startsWith("data:")) AS.delete(x).catch(() => {}); });
      }
      S.hd = S.hd.filter(x => x.id !== b.dataset.i);
      save();
      render();
    });
  }

  /* Kayıtlar */
  function vKayit() {
    const L = [...S.logs].sort((a, b) => b.date.localeCompare(a.date) || b.id.localeCompare(a.id));
    $("#v").innerHTML = "<div class='c'><h2>Kayıtlar (" + L.length + ")</h2>" +
      (L.length
        ? L.map(l => {
            const isVideoLog = String(l.id || "").startsWith("vlog_");
            const qBadge = tot(l) > 0
              ? "<span class='ok'>" + l.d + "D</span> <span class='no'>" + l.y + "Y</span> <span>" + l.b + "B</span><small>net " + f(net(l)) + "</small>"
              : "<span class='ac'>▶ Video Süresi</span><small>" + l.h + " sa</small>";
            return "<div class='li'><div>" + esc(l.konu) + "<small>" + l.date + " · " + esc(l.ders) + (l.h ? " · " + l.h + " sa" : "") + (isVideoLog ? " · otomatik eklendi" : "") + "</small></div>" +
              "<div style='text-align:right'>" + qBadge + "</div>" +
              "<button class='x' data-i='" + l.id + "' title='Sil'>✕</button></div>";
          }).join("")
        : "<div class='e'>Henüz kayıt yok. Ekle sekmesinden ilk kaydını gir.</div>") +
      "</div>";

    $("#v").querySelectorAll(".x").forEach(b => b.onclick = () => {
      S.logs = S.logs.filter(l => l.id !== b.dataset.i);
      save();
      render();
    });
  }

  /* Bulut Senkronu ve Yedekleme */
  function vSync() {
    const t = ($("#st") || {}).textContent || "";
    const githubBox = SA
      ? "<div class='c'><h2>Bulut Senkronu (GitHub Gist)</h2>" +
        (lsGet(GT)
          ? "<small class='st' id='gs'>Bağlı</small><div class='ctl'><button class='tb' id='gn'>Şimdi senkronla</button><button class='tb' id='gx'>Bağlantıyı kaldır</button></div>"
          : "<small class='st' style='display:block;margin-bottom:8px'>Cihazlar arası eşitleme için GitHub Gist token'ını gir (<a href='https://github.com/settings/tokens/new?scopes=gist&description=KPSS' target='_blank' style='color:var(--ac)'>token oluştur</a>):</small>" +
            "<input id='gt' placeholder='ghp_...' autocapitalize='off' autocomplete='off'><div style='height:10px'></div><button class='pb' id='gc'>Bağlan</button><small class='st' id='gs'></small>") +
        "</div>" +
        "<div class='c'><h2>JSON Yedekleme</h2>" +
        "<small class='st'>Tüm verilerini ve özel ünite listelerini dosya olarak indir veya başka cihazdan yükle.</small>" +
        "<div class='ctl'><button class='tb' id='bx'>Yedek indir (.json)</button><button class='tb' id='bi'>Yedeği yükle</button></div>" +
        "<div class='st' id='bk-msg' style='margin-top:6px'></div>" +
        "<input type='file' id='bf' accept='.json,application/json' style='display:none'></div>"
      : "";

    $("#v").innerHTML = "<div class='c'><h2>Senkron Durumu</h2>" +
      "<p class='ins'>" + (SA
        ? (lsGet(GT) ? "GitHub senkronu bağlı. Aynı hesapla bağlanan cihazlarda veriler otomatik eşitlenir." : "Henüz bulut bağlanmadı: veriler bu cihazda saklanıyor.")
        : "Bulut bağlantısı aktif.") + "</p>" +
      "<small class='st'>" + esc(t) + "</small></div>" +
      githubBox;

    if (SA) {
      if ($("#bx")) {
        $("#bx").onclick = () => {
          const a = document.createElement("a");
          a.href = URL.createObjectURL(new Blob([JSON.stringify(S)], { type: "application/json" }));
          a.download = "kpss-yedek-" + ds(new Date()) + ".json";
          a.click();
        };
      }
      if ($("#bi")) $("#bi").onclick = () => $("#bf").click();
      if ($("#bf")) {
        $("#bf").onchange = e => {
          const g = e.target.files[0];
          if (!g) return;
          g.text().then(txt => {
            try {
              S = norm(JSON.parse(txt));
              S.ts = Date.now();
              save();
              render();
              showToast("✓ Yedek yüklendi");
            } catch (x) {
              if ($("#bk-msg")) $("#bk-msg").textContent = "Geçersiz yedek dosyası.";
            }
          });
        };
      }
      if ($("#gc")) {
        $("#gc").onclick = () => {
          const tok = $("#gt").value.trim();
          if (!tok) return;
          lsSet(GT, tok);
          lsSet(GI, null);
          lsSet(GS, null);
          render();
          gsync();
        };
      }
      if ($("#gn")) $("#gn").onclick = gsync;
      if ($("#gx")) {
        $("#gx").onclick = () => {
          lsSet(GT, null);
          lsSet(GI, null);
          lsSet(GS, null);
          status("Bu cihaz");
          render();
        };
      }
    }
  }

  /* ==========================================================================
     15. PWA İKON OLUŞTURMA, TEMA VE UYGULAMA BAŞLATMA
     ========================================================================== */
  function initPWA() {
    try {
      const c = document.createElement("canvas");
      c.width = 512;
      c.height = 512;
      const ctx = c.getContext("2d");
      if (!ctx) return;

      ctx.fillStyle = "#0a0f1f";
      ctx.fillRect(0, 0, 512, 512);

      ctx.beginPath();
      ctx.arc(256, 224, 132, 0, Math.PI * 2);
      ctx.lineWidth = 28;
      ctx.strokeStyle = "#1d2746";
      ctx.stroke();

      const grd = ctx.createLinearGradient(110, 90, 400, 360);
      grd.addColorStop(0, "#22e3d0");
      grd.addColorStop(1, "#9b6bff");
      ctx.beginPath();
      ctx.arc(256, 224, 132, -Math.PI / 2, Math.PI * 1.15);
      ctx.lineWidth = 28;
      ctx.lineCap = "round";
      ctx.strokeStyle = grd;
      ctx.stroke();

      ctx.beginPath();
      ctx.arc(256, 224, 26, 0, Math.PI * 2);
      ctx.fillStyle = grd;
      ctx.fill();

      ctx.fillStyle = "#e8ecf8";
      ctx.font = "bold 54px -apple-system, system-ui, sans-serif";
      ctx.textAlign = "center";
      ctx.fillText("KPSS", 256, 438);

      const iconUrl = c.toDataURL("image/png");
      const iconEl = $("#app-icon");
      if (iconEl) iconEl.href = iconUrl;

      const manifest = {
        name: "KPSS Soru Takip",
        short_name: "KPSS Takip",
        start_url: ".",
        display: "standalone",
        background_color: "#0a0f1f",
        theme_color: "#0a0f1f",
        icons: [{ src: iconUrl, sizes: "512x512", type: "image/png" }]
      };
      const mUrl = URL.createObjectURL(new Blob([JSON.stringify(manifest)], { type: "application/manifest+json" }));
      const mEl = $("#app-manifest");
      if (mEl) mEl.href = mUrl;
    } catch (e) {}
  }

  window.onerror = function (msg) {
    const v = document.getElementById("v");
    if (v && !v.innerHTML.trim()) {
      v.innerHTML = "<div class='c'>Uygulama yüklenirken hata oluştu: " + esc(msg) + "</div>";
    }
  };

  try {
    $("#cl0").onclick = () => {
      tab = "sync";
      render();
      window.scrollTo(0, 0);
    };

    $("#th").onclick = () => {
      const r = document.documentElement;
      const dark = getComputedStyle(r).colorScheme === "dark";
      r.setAttribute("data-theme", dark ? "light" : "dark");
    };

    document.addEventListener("visibilitychange", () => {
      if (!document.hidden) gsync();
    });
    window.addEventListener("focus", gsync);

    initPWA();
    render();
    status(lsGet(GT) ? "Senkron hazır" : "Bu cihaz");
    cloud();
    setTimeout(gsync, 300);
  } catch (err) {
    const v = document.getElementById("v");
    if (v) {
      v.innerHTML = "<div class='c'>Hata: " + esc(err && err.message ? err.message : err) + "</div>";
    }
  }
})();
</script>
</body>
