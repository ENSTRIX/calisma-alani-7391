<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="KPSS Takip">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0a0f1f">
<link rel="apple-touch-icon" id="app-icon">
<link rel="manifest" id="app-manifest">
<title>KPSS Soru Takip</title>
<style>
:root {
  --bg: #0a0f1f;
  --card: #131a30;
  --tx: #e8ecf8;
  --mu: #8b95b5;
  --ac: #22e3d0;
  --ac2: #9b6bff;
  --bd: #222c4a;
  --ok: #2ee59d;
  --no: #ff5d7a;
  --wn: #ffb020;
  color-scheme: dark;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}

@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #f3f5fb;
    --card: #ffffff;
    --tx: #14192e;
    --mu: #5d678a;
    --ac: #00a896;
    --ac2: #6d3fe0;
    --bd: #dde2f0;
    --ok: #12a36b;
    --no: #d63a58;
    --wn: #d9820b;
    color-scheme: light;
  }
}

:root[data-theme="light"] {
  --bg: #f3f5fb;
  --card: #ffffff;
  --tx: #14192e;
  --mu: #5d678a;
  --ac: #00a896;
  --ac2: #6d3fe0;
  --bd: #dde2f0;
  --ok: #12a36b;
  --no: #d63a58;
  --wn: #d9820b;
  color-scheme: light;
}

* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  padding: 0;
  overflow-x: hidden;
}

body {
  background: var(--bg);
  color: var(--tx);
  font: 16px/1.42 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
}

.w {
  max-width: 760px;
  margin: 0 auto;
  padding: 14px 14px calc(98px + env(safe-area-inset-bottom, 0px));
}

/* Üst Başlık */
header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
  flex-wrap: nowrap;
  margin-bottom: 12px;
  min-height: 36px;
}

h1 {
  font-size: 17px;
  margin: 0;
  white-space: nowrap;
  min-width: 0;
  display: flex;
  align-items: center;
  gap: 7px;
  background: linear-gradient(90deg, var(--ac), var(--ac2));
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}

.hdr-r {
  display: flex;
  align-items: center;
  gap: 5px;
  flex-shrink: 0;
}

.st {
  font-size: 12px;
  color: var(--mu);
}

#st {
  max-width: 96px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  display: inline-block;
  vertical-align: middle;
  font-size: 11px;
  background: var(--card);
  border: 1px solid var(--bd);
  border-radius: 999px;
  padding: 3px 8px;
}

button, select, input, textarea {
  font: inherit;
  color: var(--tx);
}

.tb {
  background: none;
  border: 1px solid var(--bd);
  border-radius: 10px;
  padding: 6px 10px;
  cursor: pointer;
  transition: border-color 0.15s, color 0.15s, background 0.15s;
}

.tb:active {
  transform: scale(0.98);
}

header .tb {
  padding: 5px 8px;
}

#cl0 {
  color: var(--mu);
  display: inline-flex;
  align-items: center;
  justify-content: center;
}

#cl0 svg {
  width: 18px;
  height: 18px;
  stroke: currentColor;
  fill: none;
  stroke-width: 1.8;
  stroke-linecap: round;
  stroke-linejoin: round;
  display: block;
}

#cl0.good { color: var(--ok); border-color: var(--ok); }
#cl0.bad { color: var(--no); border-color: var(--no); }
#cl0.busy { color: var(--ac2); border-color: var(--ac2); }

/* Kartlar */
.c {
  background: var(--card);
  border: 1px solid var(--bd);
  border-radius: 16px;
  padding: 14px;
  margin-bottom: 12px;
  position: relative;
}

.c h2 {
  font-size: 15px;
  margin: 0 0 10px;
  color: var(--mu);
  font-weight: 600;
}

.hero {
  border-color: var(--ac);
}

.plan-card {
  border-color: var(--ac2);
  background: linear-gradient(145deg, color-mix(in srgb, var(--card) 92%, var(--ac2)), var(--card));
}

.next-vid {
  border-color: var(--ac);
  background: linear-gradient(145deg, color-mix(in srgb, var(--card) 92%, var(--ac)), var(--card));
}

.g {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 8px;
  text-align: center;
}

.g b {
  display: block;
  font-size: 21px;
}

.g span {
  font-size: 12px;
  color: var(--mu);
}

.ok { color: var(--ok); }
.no { color: var(--no); }
.ac { color: var(--ac); }
.wn { color: var(--wn); }

.bar {
  height: 8px;
  background: var(--bd);
  border-radius: 8px;
  overflow: hidden;
}

.bar i {
  display: block;
  height: 100%;
  border-radius: 8px;
  transition: width 0.25s ease;
}

.row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
  font-size: 14px;
  margin: 10px 0 4px;
}

.row small {
  color: var(--mu);
  text-align: right;
}

.wk {
  display: flex;
  gap: 6px;
  align-items: flex-end;
  height: 110px;
}

.wk div {
  flex: 1;
  text-align: center;
  font-size: 11px;
  color: var(--mu);
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
  height: 100%;
}

.wk i {
  display: block;
  background: linear-gradient(var(--ac), var(--ac2));
  border-radius: 6px 6px 0 0;
  min-height: 2px;
}

label {
  display: block;
  font-size: 13px;
  color: var(--mu);
  margin: 10px 0 4px;
}

select, input, textarea {
  width: 100%;
  background: var(--bg);
  border: 1px solid var(--bd);
  border-radius: 10px;
  padding: 10px 11px;
}

textarea {
  min-height: 115px;
  resize: vertical;
}

.n3 {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
}

.pv {
  margin: 12px 0;
  text-align: center;
  font-size: 16px;
}

.pb {
  width: 100%;
  background: linear-gradient(90deg, var(--ac), var(--ac2));
  border: 0;
  border-radius: 12px;
  padding: 13px;
  font-weight: 700;
  color: #06101f;
  cursor: pointer;
}

.pb:disabled {
  opacity: 0.6;
  cursor: not-allowed;
}

.li {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
  padding: 10px 0;
  border-top: 1px solid var(--bd);
  font-size: 14px;
}

.li:first-child {
  border-top: 0;
}

.li small {
  color: var(--mu);
  display: block;
}

.x {
  background: none;
  border: 1px solid transparent;
  border-radius: 8px;
  color: var(--no);
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  padding: 4px 7px;
  min-width: 28px;
  min-height: 28px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  white-space: nowrap;
}

.x:hover {
  border-color: color-mix(in srgb, var(--no) 40%, transparent);
  background: color-mix(in srgb, var(--no) 10%, transparent);
}

.dim {
  opacity: 0.62;
}

.e {
  color: var(--mu);
  text-align: center;
  padding: 16px;
  font-size: 14px;
}

.ctl {
  display: flex;
  gap: 8px;
  margin: 8px 0 2px;
  align-items: center;
}

.ctl select, .ctl input {
  flex: 1;
  padding: 9px;
}

.ctl .tb {
  white-space: nowrap;
}

.ctl .pb {
  flex: 2;
}

details {
  margin: 6px 0 10px;
  font-size: 14px;
}

summary {
  cursor: pointer;
  color: var(--ac);
}

.dd {
  margin: 0;
}

.ds {
  list-style: none;
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 16px;
  color: var(--tx);
  cursor: pointer;
  padding: 2px 0;
  user-select: none;
}

.ds::-webkit-details-marker {
  display: none;
}

.ds::after {
  content: '▾';
  color: var(--ac);
  font-size: 18px;
  transition: transform 0.2s;
  flex-shrink: 0;
}

.dd[open] > .ds::after {
  transform: rotate(180deg);
}

.d-dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  display: inline-block;
  margin-right: 7px;
  flex-shrink: 0;
}

.vi {
  display: flex;
  gap: 8px;
  align-items: flex-start;
  margin: 0;
  padding: 7px 0;
  border-top: 1px solid var(--bd);
  font-size: 14px;
  color: var(--tx);
}

.vi input[type="checkbox"] {
  width: 18px;
  height: 18px;
  margin-top: 2px;
  accent-color: var(--ac);
  flex-shrink: 0;
}

.vi select {
  width: auto;
  max-width: 48%;
  padding: 6px;
}

.vi.w span {
  text-decoration: line-through;
  color: var(--mu);
}

/* Atlanan / Eksik Video Uyarı Kutusu */
.gap-box {
  background: color-mix(in srgb, var(--wn) 12%, var(--bg));
  border: 1px solid color-mix(in srgb, var(--wn) 55%, var(--bd));
  border-radius: 12px;
  padding: 9px 11px;
  margin: 8px 0;
  font-size: 13px;
}

.gap-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  padding: 4px 0;
}

/* Günlük Düzen Kontrol Listesi ve Çalışma Planı */
.routine-row {
  display: flex;
  align-items: center;
  gap: 9px;
  padding: 7px 0;
  border-top: 1px solid var(--bd);
  font-size: 13.5px;
  cursor: pointer;
}

.routine-row:first-child {
  border-top: 0;
}

.routine-row input[type="checkbox"] {
  width: 18px;
  height: 18px;
  accent-color: var(--ok);
  flex-shrink: 0;
}

.routine-row.done span {
  text-decoration: line-through;
  color: var(--mu);
}

.plan-step {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  padding: 9px 10px;
  border-radius: 12px;
  background: var(--bg);
  border: 1px solid var(--bd);
  margin-bottom: 7px;
}

.plan-step.today-step {
  border-color: var(--ac);
}

.er3 {
  display: grid;
  grid-template-columns: 1fr 56px 56px 56px;
  gap: 6px;
  align-items: center;
  margin: 6px 0;
}

.er3 input {
  padding: 9px 4px;
  text-align: center;
}

.mq {
  margin: 8px 0;
  color: var(--mu);
  font-size: 14px;
}

.chips {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin: 8px 0;
}

.chips span {
  background: var(--bg);
  border: 1px solid var(--bd);
  border-radius: 20px;
  padding: 4px 10px;
  font-size: 12.5px;
}

.hc {
  white-space: pre-wrap;
  font-size: 14px;
  margin: 4px 0;
}

.hb {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
  margin-top: 6px;
}

.rings {
  display: flex;
  gap: 8px;
  margin: 12px 0;
}

.rg {
  flex: 1;
  min-width: 0;
  text-align: center;
  background: var(--bg);
  border: 1px solid var(--bd);
  border-radius: 16px;
  padding: 10px 4px;
}

.rg svg {
  width: 82px;
  max-width: 100%;
}

.rg b {
  display: block;
  font-size: 12px;
}

.rg small {
  color: var(--mu);
  font-size: 11px;
}

.seg {
  display: flex;
  gap: 6px;
  background: var(--bg);
  border: 1px solid var(--bd);
  border-radius: 14px;
  padding: 4px;
  margin-bottom: 12px;
}

.seg button {
  flex: 1;
  background: none;
  border: 0;
  border-radius: 10px;
  padding: 8px 4px;
  color: var(--mu);
  cursor: pointer;
  font-size: 13px;
}

.seg button.on {
  background: linear-gradient(135deg, var(--ac), var(--ac2));
  color: #06101f;
  font-weight: 700;
}

.clock {
  position: relative;
  width: 230px;
  max-width: 100%;
  margin: 10px auto;
}

.clock svg {
  width: 100%;
  display: block;
}

.clock div {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}

.clock b {
  font-size: 42px;
  font-variant-numeric: tabular-nums;
}

.clock small {
  color: var(--mu);
}

.bk {
  margin-bottom: 18px;
}

.back {
  background: none;
  border: 0;
  color: var(--ac);
  padding: 0 0 12px;
  font-size: 15px;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 4px;
}

.back b {
  color: var(--tx);
}

.gh {
  font-size: 12px;
  color: var(--mu);
  margin: 14px 0 8px;
  letter-spacing: 0.06em;
  font-weight: 600;
}

.mi {
  display: flex;
  align-items: center;
  gap: 12px;
  width: 100%;
  text-align: left;
  background: var(--card);
  border: 1px solid var(--bd);
  border-left: 4px solid var(--c1);
  border-radius: 14px;
  padding: 14px;
  margin-bottom: 10px;
  color: var(--tx);
  cursor: pointer;
}

.mi > span {
  font-size: 24px;
}

.mi div {
  flex: 1;
}

.mi small {
  display: block;
  color: var(--mu);
}

.mi em {
  font-style: normal;
  color: var(--c1);
  font-weight: 700;
  font-size: 13px;
}

.mic svg {
  width: 26px;
  height: 26px;
  stroke: currentColor;
  fill: none;
  stroke-width: 1.8;
  stroke-linecap: round;
  stroke-linejoin: round;
  display: block;
}

.dg {
  display: flex;
  gap: 6px;
  align-items: flex-end;
}

.dc {
  flex: 1;
  text-align: center;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
}

.dc small {
  font-size: 11px;
  color: var(--mu);
  min-height: 14px;
}

.stk {
  width: 70%;
  max-width: 34px;
  display: flex;
  flex-direction: column;
  border-radius: 6px;
  overflow: hidden;
  min-height: 2px;
}

.stk i {
  display: block;
}

.kp {
  display: flex;
  gap: 8px;
  margin: 4px 0 12px;
}

.kp div {
  flex: 1;
  background: var(--bg);
  border: 1px solid var(--bd);
  border-radius: 12px;
  padding: 10px 4px;
  text-align: center;
}

.kp b {
  display: block;
  font-size: 19px;
}

.kp small {
  color: var(--mu);
  font-size: 11.5px;
}

.ins {
  margin: 8px 0;
  font-size: 14px;
}

/* Ünite / Konu Düzenleyici Satırları */
.u-row {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 7px 0;
  border-top: 1px solid var(--bd);
}

.u-row:first-child {
  border-top: 0;
}

.u-idx {
  min-width: 26px;
  font-size: 12px;
  color: var(--mu);
  font-weight: 600;
}

.u-ren {
  flex: 1;
  padding: 7px 9px;
  font-size: 14px;
}

.u-act {
  display: flex;
  gap: 3px;
  flex-shrink: 0;
  align-items: center;
}

.u-act button {
  padding: 4px 7px;
  font-size: 12.5px;
}

/* YouTube Sıralı Video Kuyruğu Öğeleri */
.vq-item {
  display: flex;
  align-items: flex-start;
  gap: 8px;
  padding: 10px 0;
  border-top: 1px solid var(--bd);
}

.vq-item:first-child {
  border-top: 0;
}

.vq-item input[type="checkbox"] {
  width: 18px;
  height: 18px;
  margin-top: 3px;
  flex-shrink: 0;
  accent-color: var(--ac);
}

.vq-item input[type="checkbox"].sel-chk {
  accent-color: var(--no);
}

.vq-body {
  flex: 1;
  min-width: 0;
}

.vq-title {
  display: block;
  color: var(--tx);
  text-decoration: none;
  font-size: 14px;
  font-weight: 500;
  word-break: break-word;
}

.vq-title:hover {
  color: var(--ac);
}

.vq-item.w .vq-title {
  text-decoration: line-through;
  color: var(--mu);
}

.vq-meta {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 6px;
  margin-top: 6px;
  font-size: 12px;
  color: var(--mu);
}

.vq-tag {
  background: var(--bg);
  border: 1px solid var(--bd);
  border-radius: 8px;
  padding: 2px 7px;
  font-size: 11px;
}

.vq-tag.today {
  border-color: var(--ok);
  color: var(--ok);
}

.vq-sel {
  width: auto;
  max-width: 100%;
  padding: 4px 7px;
  font-size: 12px;
  border-radius: 8px;
}

.bulk-bar {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  align-items: center;
  background: var(--bg);
  border: 1px solid var(--bd);
  border-radius: 12px;
  padding: 8px 10px;
  margin: 8px 0;
}

.danger-btn {
  border-color: color-mix(in srgb, var(--no) 55%, var(--bd));
  color: var(--no);
}

/* Kısa Bildirim (Toast) */
#toast {
  position: fixed;
  left: 50%;
  bottom: calc(82px + env(safe-area-inset-bottom, 0px));
  transform: translateX(-50%) translateY(16px);
  background: var(--card);
  color: var(--tx);
  border: 1px solid var(--ac);
  border-radius: 999px;
  padding: 8px 16px;
  font-size: 13px;
  font-weight: 600;
  box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.2s, transform 0.2s;
  z-index: 60;
  max-width: 90vw;
  text-align: center;
}

#toast.show {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}

/* Sabit Alt Navigasyon Çubuğu */
#nav {
  position: fixed;
  left: 50%;
  bottom: 0;
  width: 100%;
  max-width: 760px;
  transform: translateX(-50%);
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  z-index: 30;
  background: var(--card);
  border: 1px solid var(--bd);
  border-bottom: 0;
  border-radius: 18px 18px 0 0;
  padding-bottom: env(safe-area-inset-bottom, 0px);
  box-shadow: 0 -6px 24px rgba(0, 0, 0, 0.25);
}

#nav button {
  background: none;
  border: 0;
  border-top: 3px solid transparent;
  border-radius: 0;
  margin-top: -1px;
  padding: 9px 0 8px;
  font-size: 12px;
  color: var(--mu);
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
}

#nav button.on {
  color: var(--tx);
  font-weight: 700;
  border-image: linear-gradient(90deg, var(--ac), var(--ac2)) 1;
}

#nav svg {
  width: 22px;
  height: 22px;
  stroke: currentColor;
  fill: none;
  stroke-width: 1.8;
  stroke-linecap: round;
  stroke-linejoin: round;
}

#nav button.on svg {
  stroke: var(--ac);
}
</style>
</head>
<body>
<div class="w">
  <header>
    <h1>
      <svg width="26" height="26" viewBox="0 0 32 32" style="flex-shrink:0">
        <defs>
          <linearGradient id="lg" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#22e3d0"/>
            <stop offset="1" stop-color="#9b6bff"/>
          </linearGradient>
        </defs>
        <circle cx="16" cy="16" r="12" fill="none" stroke="#26304f" stroke-width="4"/>
        <path d="M16 4A12 12 0 1 1 4.6 12.3" fill="none" stroke="url(#lg)" stroke-width="4" stroke-linecap="round"/>
        <circle cx="16" cy="16" r="3" fill="url(#lg)"/>
      </svg>
      KPSS Soru Takip
    </h1>
    <div class="hdr-r">
      <span class="st" id="st">Hazır</span>
      <button class="tb" id="cl0" title="Bulut senkronu">
        <svg viewBox="0 0 24 24">

  // "3:07:47" veya "45:20" formatındaki süreyi dakikaya çevirir
  function parseDurationMinutes(durStr) {
    const s = String(durStr || "").trim();
    if (!s) return 0;
    const parts = s.split(":").map(Number);
    if (parts.some(isNaN)) return 0;
    if (parts.length === 3) return parts[0] * 60 + parts[1] + parts[2] / 60;
    if (parts.length === 2) return parts[0] + parts[1] / 60;
    return 0;
  }

  function cleanVideoTitle(raw) {
    let t = String(raw || "").trim();
    if (!t) return "";

    t = t.replace(/[–—]/g, "-").replace(/\s+/g, " ").trim();

    for (let pass = 0; pass < 4; pass++) {
      const m = t.match(/^\s*#?(\d{1,3})\s*[.):\-\]]\s*(.+)$/);
      if (m && +m[1] < 300) {
        t = m[2].trim();
      } else {
        break;
      }
    }

    for (let pass = 0; pass < 3; pass++) {
      const before = t;
      t = t.replace(/^(?:\[[^\]]+\]\s*|\([^)]*(?:KPSS|AGS|20\d{2})[^)]*\)\s*)/i, "").trim();
      t = t.replace(/^(?:20\d{2}\s*)?(?:KPSS|AGS|ÖABT|TYT|AYT|DGS|ALES|MSÜ)(?:\s*[\/\-&,]\s*(?:KPSS|AGS|ÖABT|TYT|AYT|DGS|ALES|MSÜ))*\s*(?:[-:|]\s*)?/i, "").trim();
      t = t.replace(/^(?:Genel\s+Kültür|Genel\s+Yetenek|GK\s*-?\s*GY)\s*(?:[-:|]\s*)?/i, "").trim();
      t = t.replace(/^(?:Tarih|History|Türkçe|Matematik|Geometri|Coğrafya|Vatandaşlık|Güncel\s+Bilgiler|Eğitim\s+Bilimleri)\s*(?:Ders(?:i|leri)?|Konu\s+Anlatımı|Soru\s+Çözümü|Genel\s+Tekrar)?\s*[-:|]\s*/i, "").trim();
      if (t === before) break;
    }

    for (let pass = 0; pass < 5; pass++) {
      const before = t;
      t = t.replace(/\s*[\(\[]\s*(?:20\d{2}|KPSS|AGS|Yeni|Güncel|PDF)[^\)\]]*[\)\]]\s*$/i, "").trim();
      t = t.replace(/\s*(?:[-|]\s*)?20\d{2}\s*$/, "").trim();
      t = t.replace(/\s*[-|]\s*(?:Konu\s+Anlatımı|Soru\s+Çözümü|Genel\s+Tekrar|Ders\s+Notları)\s*$/i, "").trim();

      const dashIdx = Math.max(t.lastIndexOf(" - "), t.lastIndexOf(" | "), t.lastIndexOf(" -"));
      if (dashIdx > 3) {
        const tail = t.slice(dashIdx).replace(/^[\s\-|]+/, "").trim();
        const tailLower = tail.toLocaleLowerCase("tr");
        const isKnownInstructor = INSTRUCTOR_PATTERNS.some(p => tailLower.includes(p));
        const words = tail.split(/\s+/);
        const looksLikePersonName = words.length >= 2 && words.length <= 4 &&
          words.every(w => /^[A-ZÇĞİÖŞÜ][a-zçğıöşüA-ZÇĞİÖŞÜ.]+$/.test(w)) &&
          !/^(Türk|Osmanlı|Kurtuluş|İnkılap|Atatürk|Türkiye|Anayasa|Temel|İdare|Yargı|Yasama|Yürütme|Sözcükte|Cümlede|Paragrafta|Üslü|Köklü|Oran|Yüzde|Sayı|Yaş|İşçi|Hareket|Karışım|Açılar|Çokgenler|Çember|Analitik)/i.test(tail);

        if (isKnownInstructor || looksLikePersonName) {
          t = t.slice(0, dashIdx).trim();
        }
      }
      if (t === before) break;
    }

    t = t.replace(/\(\s*(I{1,3}|IV|VI{0,3}|IX|X{1,2})\s*\)\s*$/i, (_, r) => {
      const n = ROMAN_MAP[r.toUpperCase()];
      return n ? "(" + n + ")" : _;
    });

    t = t.replace(/(?:\s*[-:]\s*|\s+(?:Bölüm|Kısım|Ders|Part)\s+)(I{1,3}|IV|VI{0,3}|IX|X{1,2}|\d{1,2})\s*$/i, (_, r) => {
      const up = r.toUpperCase();
      const n = ROMAN_MAP[up] || (+r > 0 && +r < 50 ? +r : null);
      return n ? " (" + n + ")" : _;
    });

    t = t.replace(/\s+(I{1,3}|IV|VI{0,3}|IX|X{1,2})\s*$/i, (_, r) => {
      const n = ROMAN_MAP[r.toUpperCase()];
      return n ? " (" + n + ")" : _;
    });

    t = t.replace(/\s+(\d{1,2})\s*$/, (_, d) => {
      return (+d > 0 && +d < 50) ? " (" + d + ")" : _;
    });

    t = t.replace(/\s*[-:|/,]+\s*$/, "").replace(/\s+/g, " ").trim();
    return t || raw.trim();
  }

  function applySeriesNumbering(items) {
    for (let i = 0; i < items.length - 1; i++) {
      const cur = items[i];
      const nxt = items[i + 1];
      const mNext = nxt.t.match(/^(.+?)\s*\(2\)$/);
      if (mNext && !/\(\d+\)$/.test(cur.t)) {
        const nextBase = nz(mNext[1]).trim();
        const curBase = nz(cur.t).trim();
        const nextTail = nextBase.split(" ").slice(-2).join(" ");
        if (curBase === nextBase || (nextTail.length >= 6 && curBase.endsWith(nextTail))) {
          cur.t = cur.t + " (1)";
        }
      }
    }
  }

  // Seri içindeki atlanan / eksik videoları tespit eder
  function detectMissingSeriesVideos(videoRecords) {
    const groups = new Map();
    videoRecords.forEach(rec => {
      const m = String(rec.v.t || "").match(/^(.+?)\s*\((\d+)\)$/);
      if (!m) return;
      const baseTitle = m[1].trim();
      const num = parseInt(m[2], 10);
      if (num < 1 || num > 30) return;
      const gKey = rec.ders + "|" + nz(baseTitle).trim();
      if (!groups.has(gKey)) {
        groups.set(gKey, {
          ders: rec.ders,
          konu: rec.konu,
          baseTitle,
          nums: new Set(),
          minOrd: typeof rec.v.ord === "number" ? rec.v.ord : 999999
        });
      }
      const g = groups.get(gKey);
      g.nums.add(num);
      if (typeof rec.v.ord === "number" && rec.v.ord < g.minOrd) {
        g.minOrd = rec.v.ord;
        g.konu = rec.konu;
      }
    });

    const missing = [];
    groups.forEach(g => {
      const maxNum = Math.max(...g.nums);
      for (let n = 1; n < maxNum; n++) {
        if (!g.nums.has(n)) {
          missing.push({
            ders: g.ders,
            konu: g.konu,
            title: g.baseTitle + " (" + n + ")",
            suggestedOrd: Math.max(0.1, g.minOrd - (maxNum - n) * 0.1)
          });
        }
      }
    });
    return missing;
  }

    const v = item.v;
    v.w = watched ? 1 : 0;
    v.wd = watched ? t0 : "";

    const vlogId = "vlog_" + v.id;
    S.logs = S.logs.filter(l => l.id !== vlogId);

    if (watched) {
      if (item.konu && item.konu !== "?") {
        const tp = wtp(item.ders, item.konu);
        if (!tp.st) tp.st = 1;
        tp.last = t0;
      }

      const mins = parseDurationMinutes(v.dur);
      if (mins > 0) {
        const hours = Number((mins / 60).toFixed(2));
        if (hours > 0) {
          S.logs.push({
            id: vlogId,
            date: t0,
            ders: item.ders,
            konu: (item.konu && item.konu !== "?") ? item.konu : v.t,
            d: 0,
            y: 0,
            b: 0,
            h: hours
          });
          showToast("✓ +" + hours + " sa (" + Math.round(mins) + " dk) bugünkü süreye eklendi");
          return;
        }
      }
      showToast("✓ Video izlendi olarak işaretlendi");
    } else {
      showToast("Video izlendi işareti ve süresi geri alındı");
    }
  }

  /* ==========================================================================
     8. AKILLI ÇALIŞMA PLANI VE GÜNLÜK DÜZEN YARDIMCILARI
     ========================================================================== */
  function getPlanSubjects() {
    const all = Object.keys(S.ders);
    if (Array.isArray(S.pd) && S.pd.length) {
      const valid = S.pd.filter(k => all.includes(k));
      if (valid.length) return valid;
    }
    return all;
  }

  function getRemainingUnits(subjectFilter) {
    const subjects = subjectFilter || getPlanSubjects();
    const list = [];
    subjects.forEach((k, sIdx) => {
      const units = S.ders[k] || [];
      units.forEach((u, uIdx) => {
        const st = rtp(k, u).st || 0;
        if (st < 2) {
          list.push({ ders: k, konu: u, st, uIdx, sIdx });
        }
      });
    });
    return list;
  }

  function buildWeeklyPlan() {
    const subjects = getPlanSubjects();
    const queues = {};
    subjects.forEach(k => {
      queues[k] = (S.ders[k] || []).filter(u => (rtp(k, u).st || 0) < 2);
    });

    const days = [];
    let ptr = 0;
    for (let dayOffset = 0; dayOffset < 7; dayOffset++) {
      const dateStr = dPlus(dayOffset);
      const dayLabel = dayOffset === 0 ? "Bugün" : dayOffset === 1 ? "Yarın" : (dm(dateStr) + " " + DN[new Date(dateStr + "T00:00:00").getDay()]);
      const picks = [];
      let attempts = 0;
      while (picks.length < 2 && attempts < subjects.length * 2) {
        const subj = subjects[ptr % subjects.length];
        ptr++;
        attempts++;
        if (queues[subj] && queues[subj].length > 0) {
          const nextUnit = queues[subj].shift();
          picks.push({ ders: subj, konu: nextUnit });
        }
      }
      if (picks.length) {
        days.push({ dayOffset, dateStr, dayLabel, picks });
      }
    }
    return days;
  }

  function vPlan() {
    const allSubjects = Object.keys(S.ders);
    const activeSubjects = getPlanSubjects();
    const remAll = getRemainingUnits(allSubjects);
    let totalUnits = 0, doneUnits = 0;
    allSubjects.forEach(k => {
      (S.ders[k] || []).forEach(u => {
        totalUnits++;
        if ((rtp(k, u).st || 0) >= 2) doneUnits++;
      });
    });

    const planDays = buildWeeklyPlan();

    const subjChips = "<div class='chips'>" + allSubjects.map((k, idx) => {
      const on = activeSubjects.includes(k);
      const color = dColor(k, idx);
      return "<button class='tb pl-sub' data-k='" + esc(k) + "' style='" + (on ? ("border-color:" + color + ";color:" + color) : "opacity:0.5") + "'>" + (on ? "✓ " : "") + esc(k) + "</button>";
    }).join("") + "</div>";

    const dayCards = planDays.length
      ? planDays.map(d =>
          "<div class='plan-step" + (d.dayOffset === 0 ? " today-step" : "") + "'>" +
          "<div style='flex:1;min-width:0'>" +
          "<b class='" + (d.dayOffset === 0 ? "ac" : "") + "' style='font-size:13px'>" + esc(d.dayLabel) + "</b>" +
          d.picks.map(p =>
            "<div style='font-size:14px;margin-top:3px'>• <b>" + esc(p.konu) + "</b> <small class='st'>(" + esc(p.ders) + ")</small></div>"
          ).join("") +
          "</div>" +
          (d.dayOffset === 0 && d.picks.length
            ? "<button class='tb pl-done' data-k='" + esc(d.picks[0].ders) + "' data-t='" + esc(d.picks[0].konu) + "' style='color:var(--ok);border-color:var(--ok);white-space:nowrap'>İlkini Bitir ✓</button>"
            : "") +
          "</div>"
        ).join("")
      : "<div class='e'>Seçili derslerde kalan konu bulunmuyor, hepsi çalışıldı 🎉</div>";

    const bySubject = allSubjects.map((k, idx) => {
      const units = S.ders[k] || [];
      const rem = units.filter(u => (rtp(k, u).st || 0) < 2);
      const done = units.length - rem.length;
      const color = dColor(k, idx);
      return "<details" + (rem.length && idx === 0 ? " open" : "") + ">" +
        "<summary style='color:var(--tx);padding:4px 0'><span style='color:" + color + "'>●</span> <b>" + esc(k) + "</b> · " + done + "/" + units.length + " bitti (" + rem.length + " kaldı)</summary>" +
        (rem.length
          ? rem.map((u, i) =>
              "<div class='li'><div><span class='st'>" + (i + 1) + ".</span> " + esc(u) + "</div>" +
              "<button class='tb pl-done' data-k='" + esc(k) + "' data-t='" + esc(u) + "' style='padding:4px 8px;font-size:12px;color:var(--ok);border-color:var(--ok)'>Çalışıldı ✓</button></div>"
            ).join("")
          : "<div class='st' style='padding:6px 0'>Bu dersin tüm üniteleri tamamlandı ✓</div>") +
        "</details>";
    }).join("");

    $("#v").innerHTML = "<div class='c plan-card'>" +
      "<h2>📅 Akıllı Çalışma Planı ve Kalan Konular</h2>" +
      "<div class='kp'>" +
      "<div><b class='ok'>" + doneUnits + "</b><small>Biten Ünite</small></div>" +
      "<div><b class='ac'>" + remAll.length + "</b><small>Kalan Ünite</small></div>" +
      "<div><b>%" + Math.round(totalUnits ? doneUnits / totalUnits * 100 : 0) + "</b><small>Tamamlanma</small></div>" +
      "</div>" +
      "<label>Plana Dahil Dersler (dokunarak aç/kapat)</label>" +
      subjChips +
      "</div>" +
      "<div class='c'>" +
      "<h2>7 Günlük Sıralı Çalışma Takvimi</h2>" +
      "<small class='st' style='display:block;margin-bottom:8px'>Bitirdiğin her üniteden sonra takvim kalan konulara göre otomatik güncellenir.</small>" +
      dayCards +
      "</div>" +
      "<div class='c'>" +
      "<h2>Derslere Göre Kalan Üniteler</h2>" +
      bySubject +
      "</div>";

    const v = $("#v");
    v.querySelectorAll(".pl-sub").forEach(b => b.onclick = () => keep(() => {
      const k = b.dataset.k;
      const cur = new Set(getPlanSubjects());
      if (cur.has(k)) {
        if (cur.size > 1) cur.delete(k);
      } else {
        cur.add(k);
      }
      S.pd = Object.keys(S.ders).filter(x => cur.has(x));
      save();
    }));

    v.querySelectorAll(".pl-done").forEach(b => b.onclick = () => keep(() => {
      const e = wtp(b.dataset.k, b.dataset.t);
      e.st = 2;
      e.last = ds(new Date());
      save();
      showToast("✓ \"" + b.dataset.t + "\" çalışıldı olarak işaretlendi");
    }));
  }

  /* ==========================================================================
     9. ÖZET EKRANI (DASHBOARD, BUGÜN NE ÇALIŞMALIYIM?, DÜZEN, GRAFİKLER)
     ========================================================================== */
  const QT = [
    "Bugün çözdüğün her soru, sınav günü sana puan olarak döner.",
    "Düzenli çalışmak, aralıklı yoğun çalışmadan çok daha fazla kazandırır.",
    "Yanlışların seni geri çekmez, eksiğini gösterir.",
    "Bugün bir konu daha bitir, yarın bir tane daha.",
    "Hedefin tek günde değil, bugünkü düzenli çalışmayla kurulur.",
    "Yorulduysan ara ver ama bırakma.",
    "Küçük ilerlemeler birikir, deneme netlerin bunu gösterecek.",
    "Hata defterin en değerli kaynağın, ona bugün bir kayıt ekle.",
    "Odaklan, başla, gerisi gelir.",
    "Bugünkü emeğin yarınki rahatlığın."
  ];

  const DN = ["Pz", "Pt", "Sa", "Ça", "Pe", "Cu", "Ct"];
  const rtp = (k, t) => S.tp[k + "|" + t] || { st: 0, last: "" };
  const wtp = (k, t) => S.tp[k + "|" + t] || (S.tp[k + "|" + t] = { st: 0, last: "" });
  const fmin = from => S.fs.filter(x => x.date >= from).reduce((a, x) => a + (x.min || 0), 0);

  function streak() {
    const s = new Set(S.logs.map(l => l.date));
    let n = 0, d = new Date();
    if (!s.has(ds(d))) d.setDate(d.getDate() - 1);
    while (s.has(ds(d))) {
      n++;
      d.setDate(d.getDate() - 1);
    }
    return n;
  }

  function cards(s) {
    return "<div class='g'>" +
      "<div><b>" + tot(s) + "</b><span>Çözülen</span></div>" +
      "<div><b class='ok'>" + s.d + "</b><span>Doğru</span></div>" +
      "<div><b class='no'>" + s.y + "</b><span>Yanlış</span></div>" +
      "<div><b class='ac'>" + f(net(s)) + "</b><span>Net</span></div>" +
      "</div>";
  }

  function ring(p, txt, color, lab, sub) {
    const r = 38, c = 2 * Math.PI * r, dash = (c * Math.max(0, Math.min(100, p)) / 100);
    return "<div class='rg'>" +
      "<svg viewBox='0 0 92 92'>" +
      "<circle cx='46' cy='46' r='" + r + "' fill='none' stroke-width='9' style='stroke:var(--bd)'/>" +
      "<circle cx='46' cy='46' r='" + r + "' fill='none' stroke-width='9' stroke-linecap='round' style='stroke:" + color + "' stroke-dasharray='" + dash + " " + c + "' transform='rotate(-90 46 46)'/>" +
      "<text x='46' y='51' text-anchor='middle' font-size='13' font-weight='700' fill='currentColor'>" + txt + "</text>" +
      "</svg><b>" + lab + "</b><small>" + sub + "</small></div>";
  }

  function hero(td) {
    const c = S.cfg, t0 = ds(new Date()), w0 = dAgo(6), n = tot(td), dq = c.dq || 100, st = streak();
    const hs = S.logs.filter(l => l.date === t0).reduce((a, l) => a + (l.h || 0), 0) + fmin(t0) / 60;
    const h7 = S.logs.filter(l => l.date >= w0).reduce((a, l) => a + (l.h || 0), 0) + fmin(w0) / 60;
    const ex = S.ex.filter(e => e.p).sort((a, b) => a.date.localeCompare(b.date));
    const lp = ex.length ? ex[ex.length - 1].p : 0;
    const gp = Math.min(100, lp / (c.goal || 95) * 100);

    let tt = 0, dn = 0;
    for (const k in S.ders) {
      (S.ders[k] || []).forEach(t => {
        tt++;
        if (rtp(k, t).st >= 2) dn++;
      });
    }
    const pt = tt ? (dn / tt * 100) : 0;

    let cd = "";
    if (c.date) {
      const k = Math.ceil((new Date(c.date + "T00:00:00") - new Date(t0 + "T00:00:00")) / 864e5);
      if (k >= 0) cd = "<span>⏳ Sınava " + k + " gün</span>";
    }

    const msg = n >= dq
      ? "Günlük hedefi tamamladın, harikasın! 🎉"
      : n > 0
        ? "Bugün " + n + " soru çözdün, hedefe " + (dq - n) + " soru kaldı."
        : "Bugün henüz soru yok. İlk soruyla başla, gerisi gelir.";

    const pq = Math.min(100, n / dq * 100);
    return "<div class='c hero'>" +
      "<h2 style='font-size:22px;color:var(--tx);margin:0 0 4px'>Merhaba Enes 👋</h2>" +
      "<p class='mq'>" + QT[Math.floor(Date.now() / 864e5) % QT.length] + "</p>" +
      "<div class='chips'>" +
      "<span>🎯 Hedef " + c.goal + " puan</span>" +
      "<span>🔥 " + st + " gün seri</span>" +
      "<span>⏱ bugün " + f(hs) + " sa · hafta " + f(h7) + " sa</span>" +
      "<span>📝 " + S.hd.filter(h => !h.ok).length + " hata bekliyor</span>" + cd +
      "</div>" +
      "<div class='rings'>" +
      ring(pq, n + "/" + dq, "var(--ac)", "Günlük soru", "%" + Math.round(pq)) +
      ring(gp, lp || "–", "var(--ac2)", "Hedef " + c.goal, lp ? "%" + Math.round(gp) : "puan yok") +
      ring(pt, "%" + Math.round(pt), "#ff4d8d", "Konu ilerleme", dn + "/" + tt) +
      "</div>" +
      "<p class='mq' style='margin-bottom:0'>" + msg + "</p>" +
      "</div>";
  }

  function dailyPlanAndRoutineCard(td) {
    const t0 = ds(new Date());
    const planDays = buildWeeklyPlan();
    const todayPlan = planDays.length ? planDays[0] : null;
    const tomorrowPlan = planDays.length > 1 ? planDays[1] : null;
    const remTotal = getRemainingUnits().length;

    const rtToday = S.rt[t0] || {};
    const anyVidToday = getVideos("ALL").some(x => x.v.w && x.v.wd === t0);
    const qGoalDone = tot(td) >= (S.cfg.dq || 100);
    const anyErrToday = S.hd.some(h => h.date === t0);

    const tasks = [
      { id: "vid", label: "Günün konu videosunu izle", checked: Boolean(rtToday.vid || anyVidToday) },
      { id: "qst", label: "Günlük soru hedefini tamamla (" + tot(td) + "/" + (S.cfg.dq || 100) + ")", checked: Boolean(rtToday.qst || qGoalDone) },
      { id: "err", label: "Yanlış soruları hata defterine ekle", checked: Boolean(rtToday.err || anyErrToday) }

    const planBody = todayPlan

          "<div style='font-size:15px;font-weight:700'>" + esc(p.konu) + "</div></div>" +
          "<button class='tb oz-unit-done' data-k='" + esc(p.ders) + "' data-t='" + esc(p.konu) + "' style='color:var(--ok);border-color:var(--ok)'>Bitirdim ✓</button>" +
          "</div>"
        ).join("") +
        (tomorrowPlan
          ? "<small class='st' style='display:block;margin:6px 0'>Yarın sıradaki: <b>" + tomorrowPlan.picks.map(x => esc(x.konu) + " (" + esc(x.ders) + ")").join(", ") + "</b></small>"
          : "")
      : "<div class='st' style='margin-bottom:8px'>Tüm üniteler tamamlandı! Deneme ve tekrar ağırlıklı ilerleyebilirsin 🎉</div>";

    return "<div class='c plan-card'>" +
      "<div class='row' style='margin:0 0 8px'><h2 style='margin:0'>🧭 Bugün Ne Çalışmalıyım?</h2><button class='tb' id='go-plan' style='padding:4px 9px;font-size:12px'>7 Günlük Plan (" + remTotal + " kaldı) →</button></div>" +
      planBody +
      "<div style='margin-top:10px;border-top:1px solid var(--bd);padding-top:8px'>" +
      "<small class='st' style='display:block;margin-bottom:4px'>Günlük Düzen Kontrolü</small>" +
      tasks.map(tk =>
        "<label class='routine-row" + (tk.checked ? " done" : "") + "'>" +
        "<input type='checkbox' class='rt-chk' data-id='" + tk.id + "'" + (tk.checked ? " checked" : "") + ">" +
        "<span>" + esc(tk.label) + "</span>" +
        "</label>"
      ).join("") +
      "</div></div>";
  }

  function nextVideoQuickCard() {
    const allV = getVideos("ALL");
    if (!allV.length) return "";
    const nxt = allV.find(x => !x.v.w);

      "<div class='ctl' style='margin-top:10px'>" +
      "<a href='" + ytWatchUrl(nxt.v) + "' target='_blank' rel='noopener' class='tb' style='text-align:center;text-decoration:none;flex:1'>İzle ↗</a>" +

      "<button class='tb' id='go-vid'>Tümü</button>" +
      "</div></div>";

  function reviewDueCard() {
    const t0 = new Date(ds(new Date()) + "T00:00:00");
    const due = [];
    for (const k in S.ders) {
      (S.ders[k] || []).forEach(t => {
        const info = rtp(k, t);
        if (info.st >= 2 && info.last) {
          const days = Math.floor((t0 - new Date(info.last + "T00:00:00")) / 864e5);
          if (days >= 7) due.push({ k, t, days, st: info.st });
        }
      });
    }
    due.sort((a, b) => b.days - a.days);
    if (!due.length) return "";
    return "<div class='c'><h2>🔁 Tekrar Zamanı Gelen Konular (7+ gün)</h2>" +
      due.slice(0, 4).map(x =>
        "<div class='li'><div><b>" + esc(x.t) + "</b><small>" + esc(x.k) + " · " + x.days + " gün önce çalışıldı</small></div>" +
        "<button class='tb rev-ok' data-k='" + esc(x.k) + "' data-t='" + esc(x.t) + "' style='color:var(--ok);border-color:var(--ok)'>Tekrar Ettim ✓</button></div>"
      ).join("") +
      "</div>";
  }

  function wst(a, b) {
    const from = dAgo(a), to = dAgo(b);
    const L = S.logs.filter(l => l.date >= from && l.date <= to);
    const s = sum(L);
    const h = L.reduce((x, l) => x + (l.h || 0), 0) + S.fs.filter(x => x.date >= from && x.date <= to).reduce((x, y) => x + (y.min || 0), 0) / 60;
    return { L, s, h, q: tot(s), n: net(s), days: new Set(L.map(l => l.date)).size };
  }

  function ar(c, p, up) {
    const d = c - p;
    if (Math.abs(d) < 0.005) return "<span class='st'>–</span>";
    return "<span class='" + ((d > 0) === up ? "ok" : "no") + "'>" + (d > 0 ? "▲" : "▼") + " " + f(Math.abs(d)) + "</span>";
  }

  function lineCard() {
    const N = CR, days = [];
    for (let i = N - 1; i >= 0; i--) days.push(dAgo(i));
    const ks = Object.keys(S.ders);
    const ser = [["Toplam", "#22e3d0", days.map(d => tot(sum(S.logs.filter(l => l.date === d))))]];
    ks.forEach((k, idx) => {
      const v = days.map(d => tot(sum(S.logs.filter(l => l.date === d && l.ders === k))));
      if (v.some(x => x)) ser.push([k, dColor(k, idx), v]);
    });

    const vis = ser.filter(s => !CH.has(s[0]));
    const mx = Math.max(5, ...vis.flatMap(s => s[2]));
    const W = 320, H = 150, pl = 28, pr = 8, pt = 10, pb = 22;
    const xx = i => pl + i * (W - pl - pr) / Math.max(1, N - 1);
    const yy = v => H - pb - v / mx * (H - pt - pb);

    const grid = [0, 0.5, 1].map(g => {
      const v = Math.round(mx * g);
      return "<line x1='" + pl + "' x2='" + (W - pr) + "' y1='" + yy(v) + "' y2='" + yy(v) + "' style='stroke:var(--bd)'/>" +
        "<text x='" + (pl - 4) + "' y='" + (yy(v) + 3) + "' text-anchor='end' font-size='9' style='fill:var(--mu)'>" + v + "</text>";
    }).join("");

    const xl = days.map((d, i) => (N <= 7 || i % Math.ceil(N / 7) === 0 || i === N - 1)
      ? "<text x='" + xx(i) + "' y='" + (H - 6) + "' text-anchor='middle' font-size='9' style='fill:var(--mu)'>" + (N <= 7 ? DN[new Date(d + "T00:00:00").getDay()] : dm(d)) + "</text>"
      : "").join("");

    const lines = vis.map(s => {
      const tt = s[0] === "Toplam";
      const pts = s[2].map((v, i) => xx(i) + "," + yy(v)).join(" ");
      const dots = s[2].map((v, i) => (v || tt) ? "<circle cx='" + xx(i) + "' cy='" + yy(v) + "' r='" + (tt ? 3.5 : 2.5) + "' style='fill:" + s[1] + "'/>" : "").join("");
      const labels = (tt && N <= 14) ? s[2].map((v, i) => v ? "<text x='" + xx(i) + "' y='" + (yy(v) - 7) + "' text-anchor='middle' font-size='9' style='fill:var(--tx)'>" + v + "</text>" : "").join("") : "";
      return "<polyline points='" + pts + "' fill='none' stroke-width='" + (tt ? 3.5 : 2) + "' stroke-linejoin='round' stroke-linecap='round' style='stroke:" + s[1] + "'/>" + dots + labels;
    }).join("");

    const tv = ser[0][2], sm = tv.reduce((a, b) => a + b, 0), bi = tv.indexOf(Math.max(...tv));
    return "<div class='c'><h2>Günlük çözülen soru</h2>" +

      "</div>";
  }

  function weekHTML() {
    const A = wst(6, 0), B = wst(13, 7), dq = S.cfg.dq || 100, ks = Object.keys(S.ders);
    const qd = k => tot(sum(A.L.filter(l => l.ders === k)));
    const K = WD && ks.includes(WD) ? WD : (ks.slice().sort((a, b) => qd(b) - qd(a))[0] || "Türkçe");
    const nk = new Set(A.L.filter(l => l.konu).map(l => l.ders + "|" + l.konu)).size;

    const c1 = "<div class='c'><h2>Bu hafta · genel</h2>" +
      "<div class='chips'><span>🔥 " + A.days + " aktif gün</span><span>💪 " + A.q + " soru</span><span>⏱ " + f(A.h) + " sa</span>" + (nk ? "<span>📚 " + nk + " konu</span>" : "") + "</div>" +
      "<div class='kp'><div><b class='ok'>" + A.s.d + "</b><small>Doğru</small></div><div><b class='no'>" + A.s.y + "</b><small>Yanlış</small></div><div><b>" + A.s.b + "</b><small>Boş</small></div><div><b class='ac'>" + f(A.n) + "</b><small>Net</small></div></div>" +
      "<div class='row'><span>Haftalık soru hedefi</span><small>" + A.q + "/" + (dq * 7) + "</small></div>" +
      "<div class='bar'><i style='width:" + Math.min(100, A.q / (dq * 7) * 100) + "%;background:linear-gradient(90deg,var(--ac),var(--ac2))'></i></div>" +
      "</div>";

    const a = sum(A.L.filter(l => l.ders === K)), b = sum(B.L.filter(l => l.ders === K)), hb = tot(b) > 0;
    const R = (lb, c, p, up) => "<div class='row'><span>" + lb + "</span><small><b>" + f(c) + "</b> " + (hb ? ar(c, p, up) + " <span class='st'>geçen hafta " + f(p) + "</span>" : "") + "</small></div>";

    const sel = "<div class='c'><h2>Haftalık analiz · ders seç</h2>" +
      "<div class='chips'>" + ks.map((k, idx) => "<button class='tb wd' data-k='" + esc(k) + "' style='" + (k === K ? ("border-color:" + dColor(k, idx) + ";color:" + dColor(k, idx)) : "") + "'>" + esc(k) + " <small>" + qd(k) + "</small></button>").join("") + "</div>" +
      (tot(a)
        ? R("Çözülen soru", tot(a), tot(b), true) + R("Doğru", a.d, b.d, true) + R("Yanlış", a.y, b.y, false) + R("Boş", a.b, b.b, false) + R("Net", net(a), net(b), true) + R("Başarı %", pct(a), pct(b), true) + (hb ? "" : "<small class='st'>Geçen hafta bu derste soru yok, karşılaştırma yapılmadı.</small>")
        : "<div class='e'>Bu hafta " + esc(K) + " dersinde soru yok.</div>") +
      "</div>";

    const units = S.ders[K] || [];
    const kt = units.map(t => [t, sum(A.L.filter(l => l.ders === K && l.konu === t)), sum(B.L.filter(l => l.ders === K && l.konu === t))]).filter(z => tot(z[1])).sort((p, q) => tot(q[1]) - tot(p[1]));
    const rest = units.filter(t => !kt.some(z => z[0] === t));

    const c3 = "<div class='c'><h2>" + esc(K) + " · konulara göre</h2>" +
      (kt.length
        ? kt.map(z => {
            const p = pct(z[1]);
            return "<div class='row'><span>" + esc(z[0]) + "</span><small>" + tot(z[1]) + " soru · " + z[1].d + "D " + z[1].y + "Y " + z[1].b + "B · net " + f(net(z[1])) + " · %" + Math.round(p) + (tot(z[2]) ? " " + ar(p, pct(z[2]), true) : "") + "</small></div>" +
              "<div class='bar'><i style='width:" + p + "%;background:" + col(p) + "'></i></div>";
          }).join("")
        : "<div class='e'>Bu hafta bu derste konu yok.</div>") +
      (rest.length ? "<small class='st' style='display:block;margin-top:10px'>Bu hafta dokunulmayan: " + esc(rest.join(", ")) + "</small>" : "") +
      "</div>";

    const W4 = [3, 2, 1, 0].map(i => sum(wst(7 * i + 6, 7 * i).L.filter(l => l.ders === K)));
    const mq = Math.max(1, ...W4.map(tot));
    const c4 = "<div class='c'><h2>" + esc(K) + " · son 4 hafta</h2>" +
      "<div class='dg'>" + W4.map((x, i) =>
        "<div class='dc'><small>" + (tot(x) || "–") + "</small>" +
        "<div class='stk' style='height:" + (tot(x) ? tot(x) / mq * 100 : 2) + "px'><i style='flex:" + x.y + ";background:var(--no)'></i><i style='flex:" + x.d + ";background:var(--ok)'></i><i style='flex:" + x.b + ";background:var(--bd)'></i></div>" +
        "<small>" + ["3 hf önce", "2 hf önce", "Geçen hf", "Bu hafta"][i] + "</small>" +
        "<small>" + (tot(x) ? f(net(x)) + " net" : "") + "</small>" +
        "<small>" + (tot(x) ? "%" + Math.round(pct(x)) : "") + "</small></div>"
      ).join("") + "</div>" +
      "<small class='st'>■ doğru · ■ yanlış · ■ boş</small></div>";

    return c1 + lineCard() + sel + c3 + c4;
  }

  function weakCard() {
    const a = [];
    for (const k in S.ders) {
      (S.ders[k] || []).forEach(t => {
        const s = sum(S.logs.filter(l => l.ders === k && l.konu === t));
        if (tot(s) >= 10) a.push([k, t, pct(s), tot(s)]);

    a.sort((x, y) => x[2] - y[2]);

      ? "<div class='c'><h2>Önce şunlara dön (en düşük başarı)</h2>" + a.slice(0, 3).map(x => "<div class='row'><span>" + esc(x[1]) + "</span><small>" + esc(x[0]) + " · %" + Math.round(x[2]) + " · " + x[3] + " soru</small></div>").join("") + "</div>"
      : "";
  }

    if ($("#cg")) {

          goal: Math.max(1, +$("#cg").value || 95),
          dq: Math.max(1, +$("#cq").value || 100),
          date: $("#cd").value
        };
        save();
        render();

      ["cg", "cq", "cd"].forEach(i => $("#" + i).onchange = u);

  function vEkle() {
    const dk = Object.keys(S.ders);
    $("#v").innerHTML = "<div class='c'><h2>Günlük soru kaydı</h2>" +
      "<label>Tarih</label><input type='date' id='dt' value='" + ds(new Date()) + "'>" +
      "<label>Ders</label><select id='ds'>" + dk.map(k => "<option value='" + esc(k) + "'>" + esc(k) + "</option>").join("") + "</select>" +
      "<label>Konu / Ünite</label><select id='kn'></select>" +
      "<label>Toplam soru (yazarsan boş otomatik hesaplanır)</label><input type='number' inputmode='numeric' min='0' id='tq' placeholder='Örn. 30'>" +
      "<div class='n3'>" +
      "<div><label>Doğru</label><input type='number' inputmode='numeric' min='0' id='d' value='0'></div>" +
      "<div><label>Yanlış</label><input type='number' inputmode='numeric' min='0' id='y' value='0'></div>" +
      "<div><label>Boş</label><input type='number' inputmode='numeric' min='0' id='b' value='0'></div>" +
      "</div>" +
      "<label>Çalışma süresi (saat)</label><input type='number' inputmode='decimal' step='0.25' min='0' id='hr' placeholder='Örn. 2.5'>" +
      "<div class='pv' id='pv'></div>" +
      "<button class='pb' id='sv'>Kaydet</button>" +
      "</div>";

    const g = i => Math.max(0, Math.floor(+$("#" + i).value || 0));
    const fill = () => {
      const units = S.ders[$("#ds").value] || [];
      $("#kn").innerHTML = units.length
        ? units.map(k => "<option value='" + esc(k) + "'>" + esc(k) + "</option>").join("")
        : "<option value='Genel'>Genel</option>";
    };
    const pv = () => {
      const T = g("tq"), d = g("d"), y = g("y");
      if (T > 0) {
        $("#b").value = Math.max(0, T - d - y);
        $("#b").disabled = true;
      } else {
        $("#b").disabled = false;
      }
      const b = g("b");
      const warn = (T > 0 && d + y > T) ? " <span class='no'>(doğru+yanlış toplamı aşıyor)</span>" : "";
      $("#pv").innerHTML = "Toplam " + (d + y + b) + " · Boş " + b + " · Net <b class='ac'>" + f(d - y / 4) + "</b>" + warn;
    };

    fill();
    pv();
    $("#ds").onchange = fill;
    ["tq", "d", "y", "b"].forEach(i => $("#" + i).oninput = pv);
    $("#sv").onclick = () => {
      const d = g("d"), y = g("y"), b = g("b"), h = Math.max(0, +$("#hr").value || 0);
      if (d + y + b === 0 && !(h > 0)) return;
      S.logs.push({
        id: uid(),
        date: $("#dt").value || ds(new Date()),
        ders: $("#ds").value,
        konu: $("#kn").value || "Genel",
        d,
        y,
        b,
        h
      });
      save();
      tab = "ozet";
      render();
    };
  }

     11. KONULAR VE UYGULAMA İÇİ ÜNİTE / DERS DÜZENLEYİCİ
     ========================================================================== */
  const STN = ["Başlanmadı", "Devam ediyor", "Çalışıldı", "Tekrar edildi"];

  function renameTopicData(d, oldName, newName) {
    if (!oldName || !newName || oldName === newName) return;
    S.logs.forEach(l => { if (l.ders === d && l.konu === oldName) l.konu = newName; });
    S.hd.forEach(h => { if (h.ders === d && h.konu === oldName) h.konu = newName; });
    const oldKey = d + "|" + oldName, newKey = d + "|" + newName;
    if (S.tp[oldKey]) {
      S.tp[newKey] = S.tp[oldKey];
      delete S.tp[oldKey];
    }
    if (S.vd[oldKey]) {
      S.vd[newKey] = (S.vd[newKey] || []).concat(S.vd[oldKey]);
      delete S.vd[oldKey];
    }
  }

  function vKonu() {
    const dk = Object.keys(S.ders);
    if (!dk.includes(ED_DERS)) ED_DERS = dk[0] || "Türkçe";

    const modeBar = "<div class='seg'>" +
      "<button class='" + (KM === "view" ? "on" : "") + "' data-km='view'>📚 Konu Takibi</button>" +
      "<button class='" + (KM === "edit" ? "on" : "") + "' data-km='edit'>⚙️ Ünite / Konu Düzenle</button>" +
      "</div>";

    if (KM === "edit") {
      const units = S.ders[ED_DERS] || [];
      const isCustomDers = !DEFAULT_DERS[ED_DERS];

      $("#v").innerHTML = modeBar +
        "<div class='c'>" +
        "<h2>Ders Seçimi ve Yeni Ders</h2>" +
        "<label>Düzenlenecek Ders</label>" +
        "<select id='ed-ders'>" + dk.map(k => "<option value='" + esc(k) + "'" + (k === ED_DERS ? " selected" : "") + ">" + esc(k) + " (" + (S.ders[k] || []).length + " ünite)</option>").join("") + "</select>" +
        "<div class='ctl' style='margin-top:10px'>" +
        "<input id='new-ders' placeholder='Yeni ders adı (örn. Eğitim Bilimleri)'>" +
        "<button class='tb' id='add-ders'>+ Ders Ekle</button>" +
        "</div>" +
        "<div class='hb' style='margin-top:10px'>" +
        (DEFAULT_DERS[ED_DERS] ? "<button class='tb' id='rst-ders'>Varsayılan ünitelere dön</button>" : "") +
        (isCustomDers && dk.length > 1 ? "<button class='tb' id='del-ders' style='color:var(--no)'>Bu dersi sil</button>" : "") +
        "</div>" +
        "</div>" +

        "<div class='c'>" +
        "<h2>" + esc(ED_DERS) + " · Yeni Ünite Ekle</h2>" +
        "<div class='ctl'>" +
        "<input id='new-unit' placeholder='Tek ünite adı'>" +
        "<button class='tb' id='add-unit'>+ Ekle</button>" +
        "</div>" +
        "<details style='margin-top:12px' open>" +
        "<summary>📋 Test kitabından toplu ünite yapıştır (her satır bir ünite)</summary>" +
        "<textarea id='bulk-units' style='min-height:110px;margin-top:8px' placeholder='Kitabın içindekiler kısmını kopyalayıp yapıştırabilirsin:\n1. Temel Kavramlar\n2. Basamak Kavramı\n3. Bölme ve Bölünebilme'></textarea>" +
        "<div style='height:8px'></div>" +
        "<button class='pb' id='add-bulk'>Satırları Ünite Olarak Ekle</button>" +
        "<div class='st' id='bulk-msg' style='margin-top:6px'></div>" +
        "</details>" +
        "</div>" +

        "<div class='c'>" +
        "<h2>" + esc(ED_DERS) + " · Ünite Listesi (" + units.length + ")</h2>" +
        "<small class='st' style='display:block;margin-bottom:8px'>Ünite adını kutucuktan doğrudan değiştirebilir veya oklarla sırasını ayarlayabilirsin.</small>" +
        (units.length
          ? units.map((u, idx) =>
              "<div class='u-row'>" +
              "<span class='u-idx'>" + (idx + 1) + ".</span>" +
              "<input class='u-ren' data-idx='" + idx + "' value='" + esc(u) + "'>" +
              "<div class='u-act'>" +
              "<button class='tb u-up' data-idx='" + idx + "' title='Yukarı taşı'" + (idx === 0 ? " disabled" : "") + ">↑</button>" +
              "<button class='tb u-dn' data-idx='" + idx + "' title='Aşağı taşı'" + (idx === units.length - 1 ? " disabled" : "") + ">↓</button>" +
              "<button class='x u-del' data-idx='" + idx + "' title='Üniteyi sil'>✕</button>" +
              "</div></div>"
            ).join("")
          : "<div class='e'>Bu derste henüz ünite yok. Yukarıdan ekleyebilirsin.</div>") +
        "</div>";

      const v = $("#v");
      v.querySelectorAll("[data-km]").forEach(b => b.onclick = () => { KM = b.dataset.km; vKonu(); });
      $("#ed-ders").onchange = () => { ED_DERS = $("#ed-ders").value; vKonu(); };

      $("#add-ders").onclick = () => {
        const name = $("#new-ders").value.trim();
        if (!name) return;
        if (!S.ders[name]) {
          S.ders[name] = [];
          DERS = S.ders;
        }
        ED_DERS = name;
        save();
        vKonu();
      };

      if ($("#rst-ders")) {
        $("#rst-ders").onclick = () => {
          S.ders[ED_DERS] = [...DEFAULT_DERS[ED_DERS]];
          DERS = S.ders;
          save();
          vKonu();
        };
      }

      if ($("#del-ders")) {
        $("#del-ders").onclick = () => {
          delete S.ders[ED_DERS];
          DERS = S.ders;
          ED_DERS = Object.keys(S.ders)[0];
          save();
          vKonu();
        };
      }

      $("#add-unit").onclick = () => {
        const val = $("#new-unit").value.trim();
        if (!val) return;
        const list = S.ders[ED_DERS] || (S.ders[ED_DERS] = []);
        if (!list.includes(val)) {
          list.push(val);
          save();
        }
        vKonu();
      };

      $("#add-bulk").onclick = () => {
        const raw = $("#bulk-units").value.split("\n");
        const list = S.ders[ED_DERS] || (S.ders[ED_DERS] = []);
        let added = 0;
        raw.forEach(line => {
          const cleaned = line
            .replace(/^\s*(?:ünite\s*)?\d+\s*[.):\-–]\s*/i, "")
            .replace(/\s+/g, " ")
            .trim();
          if (cleaned.length >= 2 && !list.includes(cleaned)) {
            list.push(cleaned);
            added++;
          }
        });
        if (added > 0) {
          save();
          vKonu();
          const msg = $("#bulk-msg");
          if (msg) msg.textContent = added + " yeni ünite eklendi ✓";
        } else {
          const msg = $("#bulk-msg");
          if (msg) msg.textContent = "Eklenecek yeni ünite bulunamadı.";
        }
      };

        const list = S.ders[ED_DERS];
        const oldVal = list[idx];
        const newVal = inp.value.trim();
        if (!newVal || newVal === oldVal) return;
        if (list.includes(newVal)) {
          inp.value = oldVal;
          return;
        }
        list[idx] = newVal;
        renameTopicData(ED_DERS, oldVal, newVal);
        save();
      }));

      v.querySelectorAll(".u-up").forEach(b => b.onclick = () => keep(() => {
        const i = +b.dataset.idx, list = S.ders[ED_DERS];

          [list[i - 1], list[i]] = [list[i], list[i - 1]];
          save();
        }
      }));

      v.querySelectorAll(".u-dn").forEach(b => b.onclick = () => keep(() => {
        const i = +b.dataset.idx, list = S.ders[ED_DERS];
        if (i < list.length - 1) {
          [list[i + 1], list[i]] = [list[i], list[i + 1]];
          save();
        }
      }));

      v.querySelectorAll(".u-del").forEach(b => b.onclick = () => keep(() => {
        const i = +b.dataset.idx, list = S.ders[ED_DERS];
        const removed = list.splice(i, 1)[0];
        if (removed && S.vd[ED_DERS + "|" + removed]) {
          S.vd[ED_DERS + "|?"] = (S.vd[ED_DERS + "|?"] || []).concat(S.vd[ED_DERS + "|" + removed]);
          delete S.vd[ED_DERS + "|" + removed];
        }
        save();
      }));
      return;
    }

    $("#v").innerHTML = modeBar + Object.keys(S.ders).map((k, dIdx) => {
      const ts = S.ders[k] || [];
      const done = ts.filter(t => rtp(k, t).st >= 2).length;
      const um = S.vd[k + "|?"] || [];
      const od = "D|" + k;
      const color = dColor(k, dIdx);

  /* ==========================================================================
     12. YOUTUBE OYNATMA LİSTESİ ÇEKİCİ, SIRA KORUMA VE TOPLU YÖNETİM
     ========================================================================== */
  const nz = s => " " + String(s || "").toLocaleLowerCase("tr")
    .replace(/ç/g, "c").replace(/ğ/g, "g").replace(/ı/g, "i")
    .replace(/ö/g, "o").replace(/ş/g, "s").replace(/ü/g, "u")
    .replace(/[^a-z0-9]+/g, " ") + " ";

  const STOP_WORDS = new Set(["ve", "ile", "de", "da", "bir", "icin", "konu", "anlatimi", "soru", "cozumu", "kpss", "benim", "hocam", "2024", "2025", "2026", "2027", "bolum", "ders", "video", "genel", "tekrar"]);

  function cls(k, t) {
    const n = nz(t);
    const units = S.ders[k] || [];
    let best = "?", bs = 0;

    units.forEach(tp => {
      let s = 0;
      if (KW[k] && KW[k][tp]) {
        for (const kw of KW[k][tp].split(",")) {
          const cleanKw = kw.trim();
          if (!cleanKw) continue;
          if (n.includes(cleanKw.length < 4 ? " " + cleanKw + " " : " " + cleanKw)) {
            s += cleanKw.length * 1.5;
          }
        }
      }
      const nTp = nz(tp).trim();
      if (nTp.length >= 4 && n.includes(" " + nTp + " ")) {
        s += nTp.length * 2.5;
      } else {
        const tokens = nTp.split(" ").filter(w => w.length >= 3 && !STOP_WORDS.has(w));
        tokens.forEach(w => {
          if (n.includes(" " + w)) s += w.length * 1.2;
        });
      }
      if (s > bs) {
        bs = s;
        best = tp;
      }
    });

    return bs >= 4 ? best : "?";
  }

  function fetchWithTimeout(url, opts = {}, ms = 4800) {
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), ms);
    return fetch(url, Object.assign({}, opts, { signal: ctrl.signal })).finally(() => clearTimeout(timer));
  }

  function extractJsonAfter(text, marker) {
    const pos = text.indexOf(marker);
    if (pos === -1) return null;
    const start = text.indexOf("{", pos + marker.length);
    if (start === -1) return null;
    let depth = 0, inStr = false, escNext = false;
    for (let i = start; i < text.length; i++) {
      const ch = text[i];
      if (inStr) {
        if (escNext) escNext = false;
        else if (ch === "\\") escNext = true;
        else if (ch === '"') inStr = false;
      } else {
        if (ch === '"') inStr = true;
        else if (ch === "{") depth++;
        else if (ch === "}") {
          depth--;
          if (depth === 0) {
            try { return JSON.parse(text.slice(start, i + 1)); } catch (e) { return null; }
          }
        }
      }
    }
    return null;
  }

  function parseYtPlaylistHtml(html) {
    const data = extractJsonAfter(html, "var ytInitialData =") ||
      extractJsonAfter(html, 'window["ytInitialData"] =') ||
      extractJsonAfter(html, "ytInitialData =");
    if (!data) return null;

    const plTitle = (data.metadata && data.metadata.playlistMetadataRenderer && data.metadata.playlistMetadataRenderer.title) || "";
    const tabs = (data.contents && data.contents.twoColumnBrowseResultsRenderer && data.contents.twoColumnBrowseResultsRenderer.tabs) || [];
    let items = [];
    for (const tb of tabs) {
      const secs = (tb && tb.tabRenderer && tb.tabRenderer.content && tb.tabRenderer.content.sectionListRenderer && tb.tabRenderer.content.sectionListRenderer.contents) || [];
      for (const sec of secs) {
        const sub = (sec && sec.itemSectionRenderer && sec.itemSectionRenderer.contents) || [];
        for (const s of sub) {
          if (s && s.playlistVideoListRenderer && s.playlistVideoListRenderer.contents) {
            items = s.playlistVideoListRenderer.contents;
            break;
          }
        }
        if (items.length) break;
      }
      if (items.length) break;
    }

    const videos = [];
    items.forEach((it, idx) => {
      const r = it && it.playlistVideoRenderer;
      if (!r || !r.videoId) return;
      const title = ((r.title && r.title.runs ? r.title.runs.map(x => x.text).join("") : (r.title && r.title.simpleText)) || "").trim();
      const dur = ((r.lengthText && r.lengthText.simpleText) || (r.lengthText && r.lengthText.runs ? r.lengthText.runs.map(x => x.text).join("") : "") || "").trim();
      if (title && title !== "[Deleted video]" && title !== "[Private video]") {
        videos.push({ t: title, vid: r.videoId, dur, idx: idx + 1 });
      }
    });
    return videos.length ? { plTitle, videos } : null;
  }

  function formatSec(sec) {
    sec = Math.max(0, Math.floor(Number(sec) || 0));
    if (!sec) return "";
    const h = Math.floor(sec / 3600);
    const m = Math.floor((sec % 3600) / 60);
    const s = sec % 60;
    return h ? (h + ":" + pad(m) + ":" + pad(s)) : (m + ":" + pad(s));
  }

  async function fetchYoutubePlaylist(urlOrId) {
    const raw = urlOrId.trim();
    const m = raw.match(/[?&]list=([a-zA-Z0-9_-]+)/);
    const listId = m ? m[1] : (/^(PL|OL|UU|FL|RD)[a-zA-Z0-9_-]{10,}$/.test(raw) ? raw : "");
    if (!listId) throw new Error("Geçerli bir YouTube oynatma listesi linki (list=...) bulunamadı.");

    const ytUrl = "https://www.youtube.com/playlist?list=" + listId;

    const tasks = [
      fetchWithTimeout("https://pipedapi.kavin.rocks/playlists/" + listId, {}, 5000).then(async r => {
        if (!r.ok) throw new Error("Piped 1");
        const j = await r.json();
        const vids = (j.relatedStreams || []).map((s, idx) => ({
          t: (s.title || "").trim(),
          vid: (s.url || "").split("v=")[1] || "",
          dur: formatSec(s.duration),
          idx: idx + 1
        })).filter(x => x.t && x.t !== "[Deleted video]");
        if (!vids.length) throw new Error("Empty");
        return { plTitle: j.name || "", videos: vids };
      }),
      fetchWithTimeout("https://pipedapi.adminforge.de/playlists/" + listId, {}, 5000).then(async r => {
        if (!r.ok) throw new Error("Piped 2");
        const j = await r.json();
        const vids = (j.relatedStreams || []).map((s, idx) => ({
          t: (s.title || "").trim(),
          vid: (s.url || "").split("v=")[1] || "",
          dur: formatSec(s.duration),
          idx: idx + 1
        })).filter(x => x.t && x.t !== "[Deleted video]");
        if (!vids.length) throw new Error("Empty");
        return { plTitle: j.name || "", videos: vids };
      }),
      fetchWithTimeout("https://inv.nadeko.net/api/v1/playlists/" + listId, {}, 5000).then(async r => {
        if (!r.ok) throw new Error("Invidious");
        const j = await r.json();
        const vids = (j.videos || []).map((v, idx) => ({
          t: (v.title || "").trim(),
          vid: v.videoId || "",
          dur: formatSec(v.lengthSeconds),
          idx: idx + 1
        })).filter(x => x.t);
        if (!vids.length) throw new Error("Empty");
        return { plTitle: j.title || "", videos: vids };
      }),
      fetchWithTimeout("https://api.allorigins.win/get?url=" + encodeURIComponent(ytUrl), {}, 5000).then(async r => {
        if (!r.ok) throw new Error("AO");
        const j = await r.json();
        const parsed = parseYtPlaylistHtml(j.contents || "");
        if (!parsed) throw new Error("Parse failed");
        return parsed;
      })
    ];

    try {
      return await Promise.any(tasks);
    } catch (e) {
      throw new Error("Tarayıcı güvenlik kısıtı nedeniyle link otomatik çekilemedi. Hemen aşağıdaki 'Başlıkları Yapıştır' kutusuna YouTube sayfasındaki video isimlerini kopyalayıp yapıştırabilirsin — hiçbir video atlanmadan sırasıyla eklenir.");
    }
  }

  function getVideos(filterDers) {
    const out = [];
    Object.keys(S.vd).forEach(key => {
      const sep = key.indexOf("|");
      if (sep === -1) return;
      const ders = key.slice(0, sep);
      const konu = key.slice(sep + 1);
      if (filterDers && filterDers !== "ALL" && ders !== filterDers) return;
      (S.vd[key] || []).forEach((v, idx) => {
        out.push({ key, ders, konu, idx, v });
      });
    });
    out.sort((a, b) => {
      if (filterDers === "ALL" && a.ders !== b.ders) {
        return a.ders.localeCompare(b.ders, "tr");
      }
      const oa = typeof a.v.ord === "number" ? a.v.ord : 999999;
      const ob = typeof b.v.ord === "number" ? b.v.ord : 999999;
      return oa - ob;
    });
    return out;
  }

  function ytWatchUrl(v) {
    return v.vid
      ? "https://www.youtube.com/watch?v=" + encodeURIComponent(v.vid)
      : "https://www.youtube.com/results?search_query=" + encodeURIComponent(v.rt || v.t);
  }

  function simplifyAllVideos(targetDers) {
    const list = getVideos(targetDers);
    if (!list.length) return 0;
    let changed = 0;
    list.forEach(item => {
      if (!item.v.rt) item.v.rt = item.v.t;
      const cleaned = cleanVideoTitle(item.v.rt || item.v.t);
      if (cleaned && cleaned !== item.v.t) {
        item.v.t = cleaned;
        changed++;
      }
    });
    const byDers = {};
    list.forEach(item => {
      (byDers[item.ders] = byDers[item.ders] || []).push(item.v);
    });
    Object.values(byDers).forEach(arr => {
      const before = arr.map(x => x.t);
      applySeriesNumbering(arr);
      arr.forEach((x, idx) => {
        if (x.t !== before[idx]) changed++;
      });
    });
    return changed;
  }

  function restoreRawVideoTitles(targetDers) {
    const list = getVideos(targetDers);
    let restored = 0;
    list.forEach(item => {
      if (item.v.rt && item.v.rt !== item.v.t) {
        item.v.t = item.v.rt;
        restored++;
      }
    });
    return restored;
  }

    const queueRows = filteredQueue.length

            "<div class='vq-body'>" +
            (isEditing

              : "<a href='" + ytWatchUrl(v) + "' target='_blank' rel='noopener' class='vq-title'><b class='ac'>" + displayOrd + ".</b> " + esc(v.t) + "</a>") +
            "<div class='vq-meta'>" +
