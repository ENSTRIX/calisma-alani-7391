<!DOCTYPE html>
<html lang="tr" data-theme="dark" data-palette="cyan">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="KPSS Takip">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#07090e">
<link rel="apple-touch-icon" id="app-icon">
<link rel="manifest" id="app-manifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<title>KPSS Soru Takip</title>
<style>
/* ==========================================================================
   1. TASARIM SİSTEMİ, OBSİDİYEN/ALABASTER TEMA & 8 RENK PALETİ
   ========================================================================== */
:root {
  --bg: #07090e;
  --card: #0f131c;
  --card2: #161c2a;
  --tx: #f1f5f9;
  --mu: #8793b2;
  --ac: #22e3d0;
  --ac2: #9b6bff;
  --bd: rgba(255, 255, 255, 0.08);
  --bd-hi: rgba(255, 255, 255, 0.14);
  --ok: #2ee59d;
  --no: #ff5d7a;
  --wn: #ffb020;
  --shadow: inset 0 1px 0 rgba(255, 255, 255, 0.06), 0 10px 28px rgba(0, 0, 0, 0.34);
  --glass: rgba(15, 19, 28, 0.82);
  --font-ui: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  --font-mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
  color-scheme: dark;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}

:root[data-palette="cyan"]     { --ac: #22e3d0; --ac2: #9b6bff; }
:root[data-palette="emerald"]  { --ac: #10b981; --ac2: #f59e0b; }
:root[data-palette="sapphire"] { --ac: #3b82f6; --ac2: #06b6d4; }
:root[data-palette="ruby"]     { --ac: #f43f5e; --ac2: #ec4899; }
:root[data-palette="amber"]    { --ac: #f59e0b; --ac2: #ef4444; }
:root[data-palette="ocean"]    { --ac: #0ea5e9; --ac2: #14b8a6; }
:root[data-palette="lavender"] { --ac: #a855f7; --ac2: #6366f1; }
:root[data-palette="mint"]     { --ac: #34d399; --ac2: #60a5fa; }

:root[data-theme="light"] {
  --bg: #f5f7fb;
  --card: #ffffff;
  --card2: #eef2f9;
  --tx: #0f172a;
  --mu: #5b6785;
  --bd: rgba(15, 23, 42, 0.08);
  --bd-hi: rgba(15, 23, 42, 0.15);
  --ok: #0e9f68;
  --no: #dc2646;
  --wn: #d97706;
  --shadow: 0 2px 10px rgba(15, 23, 42, 0.04), 0 1px 2px rgba(15, 23, 42, 0.03);
  --glass: rgba(255, 255, 255, 0.85);
  color-scheme: light;
}
:root[data-theme="light"][data-palette="cyan"]     { --ac: #009e8e; --ac2: #6d3fe0; }
:root[data-theme="light"][data-palette="emerald"]  { --ac: #059669; --ac2: #d97706; }
:root[data-theme="light"][data-palette="sapphire"] { --ac: #2563eb; --ac2: #0891b2; }
:root[data-theme="light"][data-palette="ruby"]     { --ac: #e11d48; --ac2: #db2777; }
:root[data-theme="light"][data-palette="amber"]    { --ac: #d97706; --ac2: #dc2626; }
:root[data-theme="light"][data-palette="ocean"]    { --ac: #0284c7; --ac2: #0d9488; }
:root[data-theme="light"][data-palette="lavender"] { --ac: #7e22ce; --ac2: #4f46e5; }
:root[data-theme="light"][data-palette="mint"]     { --ac: #059669; --ac2: #2563eb; }

/* ==========================================================================
   2. SABİT EKRAN KİLİDİ & KLAVYE YAKINLAŞMA ENGELİ (16PX FORM ZORUNLULUĞU)
   ========================================================================== */
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  overflow-x: hidden;
  touch-action: manipulation;
  overscroll-behavior: none;
  -webkit-text-size-adjust: 100%;
}

body {
  background: var(--bg);
  color: var(--tx);
  font-family: var(--font-ui);
  font-size: 15px;
  line-height: 1.45;
  position: relative;
}

/* Üst ambient ışık halesi */
body::before {
  content: "";
  position: fixed;
  top: -120px;
  left: 50%;
  transform: translateX(-50%);
  width: 110vw;
  max-width: 820px;
  height: 280px;
  background: radial-gradient(ellipse at 35% 30%, color-mix(in srgb, var(--ac) 13%, transparent), transparent 65%),
              radial-gradient(ellipse at 70% 25%, color-mix(in srgb, var(--ac2) 11%, transparent), transparent 65%);
  pointer-events: none;
  z-index: 0;
}

/* Mobil tarayıcıların klavye açılınca ekranı büyütmesini %100 engelle */
input, select, textarea,
.dur-box input, .er3 input, .ctl input, .ctl select, .u-ren {
  font-size: 16px !important;
}

.mono {
  font-family: var(--font-mono);
  font-variant-numeric: tabular-nums;
}

.w {
  position: relative;
  z-index: 1;
  max-width: 760px;
  margin: 0 auto;
  padding: 12px 14px calc(106px + env(safe-area-inset-bottom, 0px));
}

.ico {
  width: 16px;
  height: 16px;
  stroke: currentColor;
  fill: none;
  stroke-width: 1.85;
  stroke-linecap: round;
  stroke-linejoin: round;
  flex-shrink: 0;
  display: inline-block;
  vertical-align: middle;
}
.ico-sm { width: 14px; height: 14px; }

/* ==========================================================================
   3. ÜST BAŞLIK & FROSTED PILL ODAK SAYACI
   ========================================================================== */
header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 6px;
  flex-wrap: nowrap;
  margin-bottom: 14px;
  min-height: 40px;
}

.brand {
  display: flex;
  align-items: center;
  gap: 8px;
  min-width: 0;
}

.brand-mark {
  width: 28px;
  height: 28px;
  border-radius: 9px;
  background: linear-gradient(135deg, color-mix(in srgb, var(--ac) 20%, var(--card2)), color-mix(in srgb, var(--ac2) 20%, var(--card2)));
  border: 1px solid color-mix(in srgb, var(--ac) 35%, var(--bd));
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.12);
}

h1 {
  font-size: 16.5px;
  font-weight: 800;
  letter-spacing: -0.03em;
  margin: 0;
  white-space: nowrap;
  color: var(--tx);
}

.hdr-r {
  display: flex;
  align-items: center;
  gap: 6px;
  flex-shrink: 0;
}

.timer-pill {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  background: var(--glass);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  border: 1px solid var(--bd);
  border-radius: 999px;
  padding: 4px 10px;
  font-size: 12.5px;
  font-weight: 700;
  box-shadow: var(--shadow);
}
.timer-pill.running {
  border-color: var(--ac);
  box-shadow: 0 0 0 2px color-mix(in srgb, var(--ac) 24%, transparent), var(--shadow);
}
#tm-disp {
  font-family: var(--font-mono);
  font-variant-numeric: tabular-nums;
  letter-spacing: -0.02em;
  cursor: pointer;
}
.timer-pill button {
  background: none;
  border: 0;
  padding: 2px 4px;
  cursor: pointer;
  color: var(--tx);
  font-size: 12px;
  font-weight: 700;
  line-height: 1;
  display: inline-flex;
  align-items: center;
}
.timer-pill button.tm-ok { color: var(--ok); }
.timer-pill button.tm-ac { color: var(--ac); }

.st { font-size: 12px; color: var(--mu); }

button, select, input, textarea { font-family: inherit; color: var(--tx); }

.tb {
  background: var(--card2);
  border: 1px solid var(--bd);
  border-radius: 10px;
  padding: 6px 10px;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 5px;
  transition: border-color 0.15s, color 0.15s, background 0.15s, transform 0.1s;
}
.tb:active { transform: scale(0.97); }
header .tb {
  padding: 6px 8px;
  background: var(--glass);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
}

#cl0 { color: var(--mu); }
#cl0 svg {
  width: 17px; height: 17px;
  stroke: currentColor; fill: none;
  stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round;
  display: block;
}
#cl0.good { color: var(--ok); border-color: color-mix(in srgb, var(--ok) 45%, var(--bd)); }
#cl0.bad { color: var(--no); border-color: color-mix(in srgb, var(--no) 45%, var(--bd)); }
#cl0.busy { color: var(--ac2); border-color: color-mix(in srgb, var(--ac2) 45%, var(--bd)); }

.timer-pop {
  background: var(--card);
  border: 1px solid color-mix(in srgb, var(--ac) 45%, var(--bd));
  border-radius: 18px;
  padding: 14px;
  margin-bottom: 14px;
  box-shadow: var(--shadow);
}

/* ==========================================================================
   4. FLAGSHIP BENTO ANA SAYFA SİSTEMİ
   ========================================================================== */
.c {
  background: var(--card);
  border: 1px solid var(--bd);
  border-radius: 18px;
  padding: 16px;
  margin-bottom: 12px;
  position: relative;
  box-shadow: var(--shadow);
}
.c h2 {
  font-size: 14.5px;
  margin: 0 0 10px;
  color: var(--tx);
  font-weight: 700;
  letter-spacing: -0.015em;
  display: flex;
  align-items: center;
  gap: 7px;
}

.micro-lbl {
  font-family: var(--font-mono);
  font-size: 10.5px;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--mu);
}

/* Editoryal Üst Bilgi Satırı */
.home-topbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
  margin-bottom: 10px;
  padding: 0 2px;
}
.home-pills {
  display: flex;
  align-items: center;
  gap: 6px;
  flex-wrap: wrap;
}
.h-pill {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  background: var(--card);
  border: 1px solid var(--bd);
  border-radius: 999px;
  padding: 4px 10px;
  font-size: 11.5px;
  font-weight: 600;
  color: var(--tx);
  box-shadow: var(--shadow);
}
.h-pill svg { color: var(--ac); }
.h-pill b { font-family: var(--font-mono); }

/* Flagship Bento Hero Kartı */
.bento-hero {
  background: linear-gradient(155deg,
    color-mix(in srgb, var(--ac) 8%, var(--card)),
    var(--card) 52%,
    color-mix(in srgb, var(--ac2) 6%, var(--card)));
  border: 1px solid color-mix(in srgb, var(--ac) 28%, var(--bd));
  border-radius: 22px;
  padding: 18px;
  margin-bottom: 10px;
  box-shadow: var(--shadow);
}

.hero-head {
  margin-bottom: 14px;
}
.hero-title {
  font-size: 22px;
  font-weight: 800;
  letter-spacing: -0.03em;
  margin: 0;
  color: var(--tx);
}
.hero-sub {
  font-size: 13px;
  color: var(--mu);
  margin: 3px 0 0;
}

.hero-telemetry {
  display: grid;
  grid-template-columns: 110px 1fr;
  gap: 16px;
  align-items: center;
  margin-bottom: 14px;
}

.radial-wrap {
  width: 110px;
  height: 110px;
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
}
.radial-wrap svg {
  width: 110px;
  height: 110px;
  overflow: visible;
}
.radial-center {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  pointer-events: none;
}
.radial-pct {
  font-family: var(--font-mono);
  font-size: 19px;
  font-weight: 800;
  letter-spacing: -0.03em;
  color: var(--tx);
  line-height: 1.1;
}
.radial-sub {
  font-family: var(--font-mono);
  font-size: 10.5px;
  color: var(--mu);
  margin-top: 2px;
}

.hero-bars {
  display: flex;
  flex-direction: column;
  gap: 10px;
  min-width: 0;
}
.hbar-item {
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.hbar-top {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 6px;
  font-size: 12px;
}
.hbar-name {
  font-weight: 600;
  color: var(--tx);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.hbar-val {
  font-family: var(--font-mono);
  font-size: 11.5px;
  font-weight: 700;
  color: var(--mu);
  flex-shrink: 0;
}

.hero-quote {
  padding: 9px 12px;
  border-left: 2.5px solid var(--ac);
  background: color-mix(in srgb, var(--bg) 62%, transparent);
  border-radius: 0 10px 10px 0;
  font-size: 12.5px;
  color: var(--mu);
  line-height: 1.45;
}

/* 2 Sütunlu Hızlı Aksiyon Rıhtımı */
.quick-dock {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 9px;
  margin-bottom: 12px;
}
.qd-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  padding: 12px 12px;
  border-radius: 14px;
  font-size: 13.5px;
  font-weight: 700;
  letter-spacing: -0.01em;
  cursor: pointer;
  transition: transform 0.12s, box-shadow 0.15s;
}
.qd-btn:active { transform: scale(0.97); }
.qd-primary {
  background: linear-gradient(135deg, var(--ac), var(--ac2));
  color: #050b16;
  border: 0;
  box-shadow: 0 6px 20px color-mix(in srgb, var(--ac) 28%, transparent);
}
.qd-secondary {
  background: var(--card);
  color: var(--tx);
  border: 1px solid var(--bd);
  box-shadow: var(--shadow);
}
.qd-secondary.is-running {
  border-color: var(--ac);
  color: var(--ac);
}

/* Bugünün Çalışma Planı Kartı */
.plan-card {
  border-color: color-mix(in srgb, var(--ac2) 34%, var(--bd));
}
.rule-badge {
  display: inline-flex;
  align-items: center;
  font-family: var(--font-mono);
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.04em;
  padding: 3px 8px;
  border-radius: 6px;
  background: color-mix(in srgb, var(--ac2) 14%, var(--bg));
  color: var(--ac2);
  border: 1px solid color-mix(in srgb, var(--ac2) 28%, transparent);
}

.plan-task {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 12px 13px;
  border-radius: 14px;
  background: var(--bg);
  border: 1px solid var(--bd);
  margin-bottom: 8px;
  transition: border-color 0.15s, opacity 0.15s;
}
.plan-task.done-step {
  opacity: 0.6;
  border-color: color-mix(in srgb, var(--ok) 35%, var(--bd));
}
.plan-task.done-step .pl-title {
  text-decoration: line-through;
  color: var(--mu);
}
.subj-meta {
  display: flex;
  align-items: center;
  gap: 7px;
  flex-wrap: wrap;
}
.subj-tag {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 11.5px;
  font-weight: 700;
}
.subj-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  display: inline-block;
  flex-shrink: 0;
}
.dur-pill {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font-family: var(--font-mono);
  font-size: 10.5px;
  font-weight: 600;
  color: var(--mu);
  background: var(--card2);
  border: 1px solid var(--bd);
  border-radius: 6px;
  padding: 1px 6px;
}
.pl-title {
  font-size: 14.5px;
  font-weight: 700;
  color: var(--tx);
  margin-top: 4px;
  line-height: 1.35;
}

/* 2x2 Bugün Telemetri Izgarası */
.tele-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 9px;
  margin-bottom: 10px;
}
.tele-cell {
  background: var(--card);
  border: 1px solid var(--bd);
  border-radius: 16px;
  padding: 13px 14px;
  box-shadow: var(--shadow);
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  gap: 6px;
}
.tele-cell.clickable {
  cursor: pointer;
  transition: border-color 0.15s, transform 0.1s;
}
.tele-cell.clickable:active { transform: scale(0.98); }
.tele-val {
  font-family: var(--font-mono);
  font-size: 20px;
  font-weight: 800;
  letter-spacing: -0.03em;
  line-height: 1.15;
}
.tele-foot {
  font-size: 11.5px;
  color: var(--mu);
  display: flex;
  justify-content: space-between;
  align-items: center;
}

/* Yatay Genel Toplam Özet Şeridi */
.total-strip {
  background: var(--card);
  border: 1px solid var(--bd);
  border-radius: 16px;
  padding: 12px 10px;
  margin-bottom: 12px;
  box-shadow: var(--shadow);
}
.total-strip-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 0 6px 8px;
  border-bottom: 1px solid var(--bd);
  margin-bottom: 10px;
}
.total-cols {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
}
.total-col {
  text-align: center;
  border-right: 1px solid var(--bd);
  padding: 0 4px;
}
.total-col:last-child { border-right: 0; }
.total-col b {
  display: block;
  font-family: var(--font-mono);
  font-size: 16px;
  font-weight: 800;
  line-height: 1.2;
}
.total-col span {
  font-size: 11px;
  color: var(--mu);
}

/* Günlük Rutinler Dairesel Onay Kutuları */
.routine-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 9px 0;
  border-top: 1px solid var(--bd);
  font-size: 14px;
}
.routine-row:first-of-type { border-top: 0; }
.routine-left {
  display: flex;
  align-items: center;
  gap: 11px;
  flex: 1;
  cursor: pointer;
  margin: 0;
  color: var(--tx);
  font-size: 14px;
}
.rt-circle {
  width: 20px;
  height: 20px;
  border-radius: 50%;
  border: 1.8px solid var(--bd-hi);
  background: var(--bg);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  transition: background 0.15s, border-color 0.15s;
}
.routine-row.done .rt-circle {
  background: var(--ok);
  border-color: var(--ok);
  color: #05110b;
}
.routine-row.done .rt-text {
  text-decoration: line-through;
  color: var(--mu);
}

/* ==========================================================================
   5. ORTAK FORM, İLERLEME ÇUBUKLARI VE BİLEŞENLER
   ========================================================================== */
.ok { color: var(--ok); }
.no { color: var(--no); }
.ac { color: var(--ac); }
.wn { color: var(--wn); }

.bar {
  height: 6px;
  background: var(--bd);
  border-radius: 999px;
  overflow: hidden;
}
.bar i {
  display: block;
  height: 100%;
  border-radius: 999px;
  transition: width 0.3s cubic-bezier(0.22, 1, 0.36, 1);
}

.row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
  font-size: 14px;
  margin: 10px 0 4px;
}
.row small { color: var(--mu); text-align: right; }

label {
  display: block;
  font-size: 12.5px;
  font-weight: 600;
  color: var(--mu);
  margin: 10px 0 4px;
}
select, input, textarea {
  width: 100%;
  background: var(--bg);
  border: 1px solid var(--bd);
  border-radius: 11px;
  padding: 9px 11px;
  transition: border-color 0.15s;
}
select:focus, input:focus, textarea:focus {
  outline: none;
  border-color: var(--ac);
}
textarea { min-height: 84px; resize: vertical; }

.n3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.n2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
.pv { margin: 10px 0; text-align: center; font-size: 15px; }

.pb {
  width: 100%;
  background: linear-gradient(135deg, var(--ac), var(--ac2));

    if (typeof val === "object") {

    }
    var s = String(val || "").trim();
    if (!s) return "";
    if (s.indexOf("data:image/") === 0 || s.indexOf("http://") === 0 || s.indexOf("https://") === 0 || s.indexOf("/_blob/") === 0) {
      return s;
    }
    if (s.indexOf("/9j/") === 0) return "data:image/jpeg;base64," + s;
    if (s.indexOf("iVBOR") === 0) return "data:image/png;base64," + s;
    if (s.indexOf("R0lGOD") === 0) return "data:image/gif;base64," + s;
    if (s.indexOf("UklGR") === 0) return "data:image/webp;base64," + s;
    if (s.length > 80 && /^[A-Za-z0-9+/=\r\n]+$/.test(s)) {
      return "data:image/jpeg;base64," + s.replace(/\s+/g, "");
    }
    return "/_blob/" + s;
  }

    for (var i = 0; i < qCandidates.length; i++) {
      var fixed = fixImgValue(qCandidates[i]);
      if (fixed) { h.img = fixed; break; }

    if (!h.img) h.img = "";

    var sCandidates = [h.img2, h.solutionImg, h.cozumImg, h.cozumFoto, h.cevapImg, h.answerImg, h.solutionPhoto, h.photo2, h.foto2];
    for (var j = 0; j < sCandidates.length; j++) {

  /* Günlük Kilitli Plan Motoru:
     KESİN KURAL: Her gün en fazla 2 farklı ders ve her dersten en fazla 1 konu (toplam maks. 2 konu).
     Aynı dersten birden fazla konu ASLA eklenmez. */
  function generateLockedDailyPlan(todayStr, forceRebuild) {
    if (!forceRebuild && S.dailyPlan[todayStr] && Array.isArray(S.dailyPlan[todayStr].items) && S.dailyPlan[todayStr].items.length) {
      var existing = S.dailyPlan[todayStr].items;
      var seenSubj = new Set();
      var validExisting = [];
      for (var eIdx = 0; eIdx < existing.length; eIdx++) {
        var it = existing[eIdx];
        if (it.manualExtra) {
          validExisting.push(it);
          continue;
        }
        if (!seenSubj.has(it.ders) && seenSubj.size < 2) {
          seenSubj.add(it.ders);
          validExisting.push(it);
        }
      }
      if (validExisting.length) {
        S.dailyPlan[todayStr].items = validExisting;
        return S.dailyPlan[todayStr];
      }
    }

    var subjects = Object.keys(S.ders);
    var candidates = [];

    subjects.forEach(function (k) {
      var units = S.ders[k] || [];
      for (var uIdx = 0; uIdx < units.length; uIdx++) {
        var u = units[uIdx];
        var info = rtp(k, u);
        if ((info.st || 0) < 2) {
          candidates.push({
            ders: k,
            konu: u,
            durMin: Number(info.durMin) || 0
          });
          break; // Her dersten en fazla 1 konu al
        }
      }
    });

    if (!candidates.length) {
      S.dailyPlan[todayStr] = { items: [] };
      save();
      return S.dailyPlan[todayStr];
    }

    if (forceRebuild) {
      var step = candidates.length >= 4 ? 2 : 1;
      S.cfg.planSeed = ((Number(S.cfg.planSeed) || 0) + step) % candidates.length;
    }

    var offset = (Number(S.cfg.planSeed) || 0) % candidates.length;
    var rotated = candidates.slice(offset).concat(candidates.slice(0, offset));

    // En fazla 2 farklı ders, her dersten en fazla 1 konu
    var selected = rotated.slice(0, 2).map(function (c) {
      return {
        id: uid(),
        ders: c.ders,
        konu: c.konu,
        durMin: c.durMin,
        done: 0
      };
    });

    S.dailyPlan[todayStr] = { items: selected };
    save();
    return S.dailyPlan[todayStr];
  }

      "</div>" +
      "</div>";

    /* 7. Tekrar Zamanı Gelen Konular (1-7-21 Gün) */
    var todayDate = new Date(t0 + "T00:00:00");
    var due = [];
    for (var k2 in S.ders) {
      (S.ders[k2] || []).forEach(function (t2) {
        var info = rtp(k2, t2);
        if (info.st >= 2 && info.last) {
          var diff = Math.floor((todayDate - new Date(info.last + "T00:00:00")) / 864e5);
          if (diff === 1 || diff === 7 || diff >= 21) {
            due.push({ k: k2, t: t2, days: diff });
          }
        }
      });
    }
    due.sort(function (a, b) { return b.days - a.days; });
    var dueHtml = due.length
      ? "<div class='c'><h2>" + UI_ICONS.repeat + " Tekrar Zamanı (1-7-21 Gün)</h2>" +
        due.slice(0, 4).map(function (x) {
          return "<div class='li'><div><b>" + esc(x.t) + "</b><small>" + esc(x.k) + " · " + x.days + " gün önce çalışıldı</small></div>" +
            "<button class='tb rev-ok' data-k='" + esc(x.k) + "' data-t='" + esc(x.t) + "' style='color:var(--ok);border-color:color-mix(in srgb,var(--ok) 45%,var(--bd))'>Tekrar Edildi</button></div>";
        }).join("") + "</div>"
      : "";

    /* 8. Günlük Rutinler Checklist Kartı */
    var rtToday = S.rt[t0] || {};
    var rtDoneCount = S.rtList.filter(function (r) { return Boolean(rtToday[r.id]); }).length;
    var rtPct = S.rtList.length ? Math.round((rtDoneCount / S.rtList.length) * 100) : 0;

    var rtHtml = "<div class='c'>" +
      "<div class='row' style='margin:0 0 8px'><h2 style='margin:0'>" + UI_ICONS.checkSq + " Günlük Rutinler</h2><span class='mono ac' style='font-size:12px;font-weight:700'>" + rtDoneCount + "/" + S.rtList.length + "</span></div>" +
      "<div class='bar' style='margin-bottom:10px'><i style='width:" + rtPct + "%;background:linear-gradient(90deg,var(--ok),var(--ac))'></i></div>" +
      S.rtList.map(function (r) {
        var isDone = Boolean(rtToday[r.id]);
        return "<div class='routine-row" + (isDone ? " done" : "") + "'>" +
          "<div class='routine-left rt-toggle' data-id='" + esc(r.id) + "'>" +
          "<span class='rt-circle'>" + (isDone ? UI_ICONS.checkTiny : "") + "</span>" +
          "<span class='rt-text'>" + esc(r.title) + "</span>" +
          "</div>" +
          "<button class='x rt-del' data-id='" + esc(r.id) + "' title='Rutini sil'>✕</button>" +
          "</div>";
      }).join("") +
      "<div class='ctl' style='margin-top:8px'>" +
      "<input id='rt-new' placeholder='Yeni rutin ekle...'>" +
      "<button class='tb' id='rt-add' style='color:var(--ac);border-color:color-mix(in srgb,var(--ac) 45%,var(--bd))'>+ Ekle</button>" +
      "</div></div>";

    $("#v").innerHTML = topBarHtml + heroHtml + dockHtml + planHtml + teleGridHtml + totalStripHtml + dueHtml + rtHtml;

    var v = $("#v");
    $("#qa-add-q").onclick = function () {
      tab = "soru_hata";
      SH_SUB = "soru";
      render();
      window.scrollTo(0, 0);
    };
    $("#qa-start-tm").onclick = function () {
      if (TM.run) { TM.acc = tel(); TM.run = false; }
      else { TM.t0 = Date.now(); TM.run = true; TM.open = true; }
      updateHeaderTimer();
      renderTimerDrawer();
    };
    $("#tele-mistakes").onclick = function () {
      tab = "soru_hata";
      SH_SUB = "hata";
      render();
      window.scrollTo(0, 0);
    };

    $("#pl-regen").onclick = function () {
      keep(function () {
        generateLockedDailyPlan(t0, true);
        showToast("Günlük plan yenilendi (maks. 2 ders · 1 konu/ders)");
      });
    };

    var fillPlEx = function () {
      var d = $("#pl-ex-ders").value;
      var units = S.ders[d] || [];
      $("#pl-ex-konu").innerHTML = units.map(function (u) { return "<option value='" + esc(u) + "'>" + esc(u) + "</option>"; }).join("");
    };
    fillPlEx();
    $("#pl-ex-ders").onchange = fillPlEx;
    $("#pl-ex-add").onclick = function () {
      var d = $("#pl-ex-ders").value, u = $("#pl-ex-konu").value;
      if (!u) return;
      keep(function () {
        var curPlan = generateLockedDailyPlan(t0, false);
        curPlan.items.push({ id: uid(), ders: d, konu: u, durMin: rtp(d, u).durMin || 0, done: 0, manualExtra: true });
        save();
        showToast("\"" + u + "\" bugünkü plana eklendi");
      });
    };

    v.querySelectorAll(".pl-item-done").forEach(function (b) {
      b.onclick = function () {
        keep(function () {
          var curPlan = S.dailyPlan[t0];
          if (!curPlan) return;
          var item = curPlan.items.find(function (x) { return x.id === b.dataset.id; });
          if (!item) return;
          item.done = item.done ? 0 : 1;
          var tp = wtp(item.ders, item.konu);
          if (item.done) {
            tp.st = 2;
            tp.last = t0;
            showToast("\"" + item.konu + "\" tamamlandı");
          } else {
            tp.st = 1;
          }
          save();
        });
      };
    });

    v.querySelectorAll(".rev-ok").forEach(function (b) {
      b.onclick = function () {
        keep(function () {
          var e = wtp(b.dataset.k, b.dataset.t);
          e.st = 3;
          e.last = t0;
          save();
          showToast("Tekrar kaydedildi");
        });
      };
    });

    v.querySelectorAll(".rt-toggle").forEach(function (rowEl) {
      rowEl.onclick = function () {
        keep(function () {
          var rid = rowEl.dataset.id;
          S.rt[t0] = S.rt[t0] || {};
          S.rt[t0][rid] = S.rt[t0][rid] ? 0 : 1;
          save();
        });
      };
    });

    $("#rt-add").onclick = function () {
      var title = $("#rt-new").value.trim();
      if (!title) return;
      keep(function () {
        S.rtList.push({ id: "rt_" + uid(), title: title });
        save();
        showToast("Yeni rutin eklendi");
      });
    };

    v.querySelectorAll(".rt-del").forEach(function (b) {
      b.onclick = function () {
        keep(function () {
          S.rtList = S.rtList.filter(function (x) { return x.id !== b.dataset.id; });
          save();
        });
      };
    });
  }

  /* ==========================================================================
     10. ANALİZ SEKMESİ (DÖNEM KIYASLAMASI ▲/▼ + HATA NEDENLERİ + GRAFİKLER)
     ========================================================================== */
  function diffBadge(cur, prev, suffix) {
    var d = cur - prev;
    if (Math.abs(d) < 0.01) return "<small class='st'>öncekiyle aynı</small>";
    var up = d > 0;
    return "<small class='" + (up ? "ok" : "no") + " mono' style='font-weight:700'>" + (up ? "▲ +" : "▼ ") + f(d) + (suffix || "") + "</small>";
  }

  function renderPeriodChart(filteredLogs, period) {
    var buckets = [];
    if (period === "week") {
      for (var i = 6; i >= 0; i--) {
        var dStr = dAgo(i);
        var s = sum(filteredLogs.filter(function (l) { return l.date === dStr; }));
        buckets.push({ label: dm(dStr), q: tot(s), n: Math.max(0, net(s)) });
      }
    } else if (period === "month") {
      for (var w = 3; w >= 0; w--) {
        var from = dAgo(w * 7 + 6), to = dAgo(w * 7);
        var s2 = sum(filteredLogs.filter(function (l) { return l.date >= from && l.date <= to; }));
        buckets.push({ label: dm(from) + "-" + dm(to), q: tot(s2), n: Math.max(0, net(s2)) });
      }
    } else {
      var byMonth = {};
      filteredLogs.forEach(function (l) {
        var ym = (l.date || "").slice(0, 7);
        if (!ym) return;
        byMonth[ym] = byMonth[ym] || [];
        byMonth[ym].push(l);
      });
      var keys = Object.keys(byMonth).sort().slice(-8);
      if (!keys.length) {
        var curYm = ds(new Date()).slice(0, 7);
        keys = [curYm];
        byMonth[curYm] = [];
      }
      keys.forEach(function (ym) {
        var s3 = sum(byMonth[ym]);
        buckets.push({ label: ym.slice(5, 7) + "/" + ym.slice(2, 4), q: tot(s3), n: Math.max(0, net(s3)) });
      });
    }

    var mx = Math.max(10, Math.max.apply(null, buckets.map(function (b) { return b.q; })));
    var W = 320, H = 155, pl = 30, pr = 12, pt = 14, pb = 24;
    var xx = function (idx) { return pl + idx * (W - pl - pr) / Math.max(1, buckets.length - 1); };
    var yy = function (val) { return H - pb - (val / mx) * (H - pt - pb); };

    var grid = [0, 0.5, 1].map(function (g) {
      var v = Math.round(mx * g);
      return "<line x1='" + pl + "' x2='" + (W - pr) + "' y1='" + yy(v) + "' y2='" + yy(v) + "' style='stroke:var(--bd)'/>" +
        "<text x='" + (pl - 4) + "' y='" + (yy(v) + 3) + "' text-anchor='end' font-size='9' style='fill:var(--mu)'>" + v + "</text>";
    }).join("");

    var qPts = buckets.map(function (b, idx) { return xx(idx) + "," + yy(b.q); }).join(" ");
    var nPts = buckets.map(function (b, idx) { return xx(idx) + "," + yy(b.n); }).join(" ");
    var areaPts = pl + "," + (H - pb) + " " + qPts + " " + xx(buckets.length - 1) + "," + (H - pb);

    var labels = buckets.map(function (b, idx) {
      return "<text x='" + xx(idx) + "' y='" + (H - 6) + "' text-anchor='middle' font-size='9' style='fill:var(--mu)'>" + esc(b.label) + "</text>" +
        (b.q > 0 ? "<text x='" + xx(idx) + "' y='" + (yy(b.q) - 6) + "' text-anchor='middle' font-size='9' font-weight='700' style='fill:var(--tx)'>" + b.q + "</text>" : "");
    }).join("");

    var dots = buckets.map(function (b, idx) {
      return "<circle cx='" + xx(idx) + "' cy='" + yy(b.q) + "' r='3.5' style='fill:var(--ac)'/>" +
        "<circle cx='" + xx(idx) + "' cy='" + yy(b.n) + "' r='3' style='fill:var(--ac2)'/>";
    }).join("");

    return "<svg viewBox='0 0 " + W + " " + H + "' style='width:100%'>" +
      "<defs><linearGradient id='ag' x1='0' y1='0' x2='0' y2='1'><stop offset='0%' stop-color='var(--ac)' stop-opacity='0.28'/><stop offset='100%' stop-color='var(--ac)' stop-opacity='0'/></linearGradient></defs>" +
      grid +
      "<polygon points='" + areaPts + "' fill='url(#ag)'/>" +
      "<polyline points='" + qPts + "' fill='none' stroke-width='3' stroke-linecap='round' stroke-linejoin='round' style='stroke:var(--ac)'/>" +
      "<polyline points='" + nPts + "' fill='none' stroke-width='2.2' stroke-dasharray='4 3' stroke-linecap='round' style='stroke:var(--ac2)'/>" +
      dots + labels +
      "</svg>" +
      "<div class='chips' style='margin-top:4px'><span><b class='ac'>—</b> Toplam Soru</span><span><b style='color:var(--ac2)'>--</b> Net</span></div>";
  }

  function renderSubjectStackedChart(filteredLogs) {
    var ks = Object.keys(S.ders);
    var stats = ks.map(function (k, idx) {
      var s = sum(filteredLogs.filter(function (l) { return l.ders === k; }));
      return { k: k, idx: idx, s: s, q: tot(s), n: net(s), p: pct(s) };
    });
    var mq = Math.max(1, Math.max.apply(null, stats.map(function (x) { return x.q; })));

    return "<div class='dg' style='height:140px;padding-top:14px'>" +
      stats.map(function (x) {
        var hPx = x.q ? Math.max(8, Math.round(x.q / mq * 92)) : 3;
        return "<div class='dc'>" +
          "<small class='mono'>" + (x.q || "–") + "</small>" +
          "<div class='stk' style='height:" + hPx + "px'>" +
          "<i style='flex:" + x.s.y + ";background:var(--no)'></i>" +
          "<i style='flex:" + x.s.d + ";background:var(--ok)'></i>" +
          "<i style='flex:" + x.s.b + ";background:var(--bd-hi)'></i>" +
          "</div>" +
          "<small style='font-weight:700;color:var(--tx)'>" + esc(x.k.slice(0, 4)) + "</small>" +
          "<small class='mono'>" + (x.q ? "%" + Math.round(x.p) : "") + "</small>" +
          "</div>";
      }).join("") +
      "</div>" +
      "<small class='st'>■ Doğru · ■ Yanlış · ■ Boş</small>";
  }

  function vAnaliz() {
    var subBar = "<div class='seg'>" +
      "<button class='" + (ANALIZ_SUB === "chart" ? "on" : "") + "' data-as='chart'>Performans & Tekrar</button>" +
      "<button class='" + (ANALIZ_SUB === "den" ? "on" : "") + "' data-as='den'>Denemeler (" + S.ex.length + ")</button>" +
      "<button class='" + (ANALIZ_SUB === "banka" ? "on" : "") + "' data-as='banka'>Bankalar (" + S.bk.length + ")</button>" +
      "</div>";

    if (ANALIZ_SUB === "den") { vDen(subBar); return; }
    if (ANALIZ_SUB === "banka") { vBanka(subBar); return; }

    var fromDate = ANALIZ_PERIOD === "week" ? dAgo(6) : ANALIZ_PERIOD === "month" ? dAgo(29) : "0000-00-00";
    var filteredLogs = S.logs.filter(function (l) { return (l.date || "") >= fromDate; });
    var totalS = sum(filteredLogs);
    var totalH = filteredLogs.reduce(function (a, l) { return a + (l.h || 0); }, 0);
    var curAcc = pct(totalS);

    var hasPrev = ANALIZ_PERIOD === "week" || ANALIZ_PERIOD === "month";
    var prevLogs = [];
    if (ANALIZ_PERIOD === "week") {
      var pFromW = dAgo(13), pToW = dAgo(7);
      prevLogs = S.logs.filter(function (l) { return (l.date || "") >= pFromW && (l.date || "") <= pToW; });
    } else if (ANALIZ_PERIOD === "month") {
      var pFromM = dAgo(59), pToM = dAgo(30);
      prevLogs = S.logs.filter(function (l) { return (l.date || "") >= pFromM && (l.date || "") <= pToM; });
    }
    var prevS = sum(prevLogs);
    var prevH = prevLogs.reduce(function (a, l) { return a + (l.h || 0); }, 0);
    var prevAcc = pct(prevS);

    var periodTitle = ANALIZ_PERIOD === "week" ? "Son 7 Gün (Haftalık)" : ANALIZ_PERIOD === "month" ? "Son 30 Gün (Aylık)" : "Tüm Zamanlar";

    var topicStats = [];
    Object.keys(S.ders).forEach(function (k) {
      (S.ders[k] || []).forEach(function (u) {
        var s = sum(filteredLogs.filter(function (l) { return l.ders === k && l.konu === u; }));
        var q = tot(s);
        if (q > 0) {
          var errRate = (s.y / q) * 100;
          topicStats.push({ ders: k, konu: u, s: s, q: q, n: net(s), acc: pct(s), errRate: errRate });
        }
      });
    });

    var weakTopics = topicStats.filter(function (x) { return x.s.y > 0; }).sort(function (a, b) {
      return (b.errRate - a.errRate) || (b.s.y - a.s.y);
    });
    var strongTopics = topicStats.filter(function (x) { return x.q >= 10 && x.acc >= 70; }).sort(function (a, b) {
      return (b.acc - a.acc) || (b.q - a.q);
    });

    var filteredMistakes = S.hd.filter(function (h) { return (h.date || "") >= fromDate; });
    var totalMistakes = filteredMistakes.length;
    var reasonCounts = {};
    HT.forEach(function (r) { reasonCounts[r] = 0; });
    filteredMistakes.forEach(function (h) {
      var key = HT.indexOf(h.t) !== -1 ? h.t : "Diğer";
      reasonCounts[key] = (reasonCounts[key] || 0) + 1;
    });
    var reasonColors = {
      "Bilgi eksikliği": "var(--no)",
      "Dikkat hatası": "var(--wn)",
      "Süre yetmedi": "var(--ac2)",
      "Karıştırdım": "#4da3ff",
      "Diğer": "var(--mu)"
    };
    var reasonsHtml = "<div class='c'><h2>Yanlış Nedenleri Dağılımı (" + totalMistakes + " kayıt)</h2>" +
      (totalMistakes
        ? HT.map(function (r) {
            var cnt = reasonCounts[r] || 0;
            var rp = Math.round((cnt / totalMistakes) * 100);
            return "<div style='margin-bottom:9px'>" +
              "<div class='row' style='margin:0 0 4px;font-size:13px'><span><b>" + esc(r) + "</b></span><small class='mono'><b>%" + rp + "</b> (" + cnt + " kayıt)</small></div>" +
              "<div class='bar'><i style='width:" + rp + "%;background:" + (reasonColors[r] || "var(--ac)") + "'></i></div>" +
              "</div>";
          }).join("")
        : "<div class='e'>Bu dönemde Hata Defteri kaydı bulunmuyor.</div>") +
      "</div>";

    var periodSwitcher = "<div class='chips'>" +
      "<button class='tb ap-btn' data-p='week' style='" + (ANALIZ_PERIOD === "week" ? "border-color:var(--ac);color:var(--ac)" : "") + "'>Haftalık (7g)</button>" +
      "<button class='tb ap-btn' data-p='month' style='" + (ANALIZ_PERIOD === "month" ? "border-color:var(--ac);color:var(--ac)" : "") + "'>Aylık (30g)</button>" +
      "<button class='tb ap-btn' data-p='all' style='" + (ANALIZ_PERIOD === "all" ? "border-color:var(--ac);color:var(--ac)" : "") + "'>Tüm Zamanlar</button>" +
      "</div>";

    var kpiHtml = "<div class='c'><h2>" + periodTitle + " · Genel Bakış</h2>" +
      periodSwitcher +
      (hasPrev ? "<small class='st' style='display:block;margin-bottom:4px'>Alt satırlar bir önceki " + (ANALIZ_PERIOD === "week" ? "7 güne" : "30 güne") + " göre değişimi gösterir.</small>" : "") +
      "<div class='kp'>" +
      "<div><b>" + tot(totalS) + "</b><small>Çözülen Soru</small>" + (hasPrev ? diffBadge(tot(totalS), tot(prevS), "") : "") + "</div>" +
      "<div><b class='ac'>" + f(net(totalS)) + "</b><small>Toplam Net</small>" + (hasPrev ? diffBadge(net(totalS), net(prevS), "") : "") + "</div>" +
      "<div><b class='ok'>%" + Math.round(curAcc) + "</b><small>Başarı Oranı</small>" + (hasPrev ? diffBadge(Math.round(curAcc), Math.round(prevAcc), "%") : "") + "</div>" +
      "<div><b>" + f(totalH) + " sa</b><small>Süre</small>" + (hasPrev ? diffBadge(totalH, prevH, " sa") : "") + "</div>" +
      "</div>" +
      "<div class='row'><span>Doğru / Yanlış / Boş</span><small class='mono'><b class='ok'>" + totalS.d + "D</b> · <b class='no'>" + totalS.y + "Y</b> · " + totalS.b + "B</small></div>" +
      "</div>";

    var trendHtml = "<div class='c'><h2>Soru & Net Gelişim Grafiği (" + periodTitle + ")</h2>" +
      renderPeriodChart(filteredLogs, ANALIZ_PERIOD) +
      "</div>";

    var stackedHtml = "<div class='c'><h2>Ders Bazlı Doğru / Yanlış Dağılımı</h2>" +
      renderSubjectStackedChart(filteredLogs) +
      "</div>";

    var weakHtml = "<div class='c'><h2>Öncelikli Tekrar Gereken / Çok Yanlış Yapılan Konular</h2>" +
      (weakTopics.length
        ? weakTopics.slice(0, 6).map(function (x) {
            return "<div class='li' style='align-items:flex-start;flex-direction:column'>" +
              "<div style='width:100%'><div class='row' style='margin:0'><b>" + esc(x.konu) + "</b><b class='no mono'>%" + Math.round(x.errRate) + " yanlış (" + x.s.y + "Y)</b></div>" +
              "<small>" + esc(x.ders) + " · " + x.q + " soru · " + x.s.d + "D " + x.s.y + "Y · Başarı %" + Math.round(x.acc) + "</small></div>" +
              "<div class='hb'>" +
              "<button class='tb add-rev-plan' data-k='" + esc(x.ders) + "' data-t='" + esc(x.konu) + "' style='color:var(--ac);border-color:color-mix(in srgb,var(--ac) 45%,var(--bd));font-size:12px'>Tekrar Listesine Ekle</button>" +
              "<button class='tb go-topic-btn' data-k='" + esc(x.ders) + "' style='font-size:12px'>Konuya Git →</button>" +
              "</div></div>";
          }).join("")
        : "<div class='e'>Bu dönemde yanlış yapılan soru kaydı bulunmuyor.</div>") +
      "</div>";

    var strongHtml = "<div class='c'><h2>En Başarılı Olduğun Konular (≥10 Soru)</h2>" +
      (strongTopics.length
        ? strongTopics.slice(0, 5).map(function (x) {
            return "<div class='row'><span><b>" + esc(x.konu) + "</b> <small class='st'>(" + esc(x.ders) + ")</small></span><small class='ok mono'><b>%" + Math.round(x.acc) + "</b> · " + x.q + " soru</small></div>";
          }).join("")
        : "<div class='e'>En az 10 soru çözülen yüksek başarılı konu henüz yok.</div>") +
      "</div>";

    var breakdownHtml = "<div class='c'><h2>Ders & Konu Detay Dökümü</h2>" +
      Object.keys(S.ders).map(function (k, idx) {
        var s = sum(filteredLogs.filter(function (l) { return l.ders === k; }));
        var p = pct(s);
        var color = dColor(k, idx);
        var subUnits = (S.ders[k] || []).map(function (u) {
          var us = sum(filteredLogs.filter(function (l) { return l.ders === k && l.konu === u; }));
          if (!tot(us)) return "";
          return "<div class='row' style='padding-left:10px;font-size:13px'><span>• " + esc(u) + "</span><small class='mono'>" + tot(us) + " soru · net " + f(net(us)) + " · %" + Math.round(pct(us)) + "</small></div>";
        }).join("");
        return "<details>" +
          "<summary style='color:var(--tx);padding:4px 0'><span style='color:" + color + "'>●</span> <b>" + esc(k) + "</b> · <span class='mono' style='font-size:12.5px'>" + tot(s) + " soru · net " + f(net(s)) + " · %" + Math.round(p) + "</span></summary>" +
          (subUnits || "<small class='st' style='padding-left:10px'>Bu dönemde soru çözülmedi.</small>") +

      var r = new FileReader();
      r.onload = function () { res(r.result); };
      r.onerror = rej;
      r.readAsDataURL(b);
    });

  function shrink(file, m, q) {
    m = m || 1200; q = q || 0.75;
    return new Promise(function (res, rej) {
      var u = URL.createObjectURL(file), im = new Image();
      im.onload = function () {
        var s = Math.min(1, m / Math.max(im.width, im.height));
        var c = document.createElement("canvas");
        c.width = Math.round(im.width * s);
        c.height = Math.round(im.height * s);
        c.getContext("2d").drawImage(im, 0, 0, c.width, c.height);
        URL.revokeObjectURL(u);
        c.toBlob(function (b) { b ? res(b) : rej(new Error("Görsel küçültülemedi")); }, "image/jpeg", q);
      };
      im.onerror = rej;
      im.src = u;
    });
  }

      if (!q && !a && !pf && !pf2) return;
      var img = "", img2 = "";
      if (pf) { try { $("#hv").textContent = "Yükleniyor…"; img = await upl(pf); } catch (e) { $("#hv").textContent = "Fotoğraf eklenemedi"; return; } }
      if (pf2) { try { $("#hv").textContent = "Yükleniyor…"; img2 = await upl(pf2); } catch (e) { $("#hv").textContent = "Fotoğraf eklenemedi"; return; } }
      LAST_H_DERS = $("#hs").value;
      LAST_H_KONU = $("#hk").value || "Genel";
      S.hd.push({
        id: uid(),
        date: ds(new Date()),
        ders: LAST_H_DERS,
        konu: LAST_H_KONU,
        t: $("#ht").value,
        q: q, a: a, img: img, img2: img2, ok: 0, n: 0
      });
      save();
      showToast("Hata defterine eklendi");
      vSoruHata();
    };

    $("#hf").onchange = function () { HF = $("#hf").value; vSoruHata(); };
    $("#ho").onchange = function () { HO = $("#ho").checked; vSoruHata(); };
    var fh = function (b) { return S.hd.find(function (x) { return x.id === b.dataset.i; }); };

    v3.querySelectorAll(".hr").forEach(function (b) { b.onclick = function () { keep(function () { var h = fh(b); h.n = (h.n || 0) + 1; save(); }); }; });
    v3.querySelectorAll(".ht2").forEach(function (b) { b.onclick = function () { keep(function () { var h = fh(b); h.ok = h.ok ? 0 : 1; save(); }); }; });
    v3.querySelectorAll(".hed").forEach(function (b) { b.onclick = function () { keep(function () { EDIT_H_ID = b.dataset.i; }); }; });
    if ($(".hed-cancel")) {
      $(".hed-cancel").onclick = function () { keep(function () { EDIT_H_ID = ""; }); };
    }
    if ($(".hed-save")) {
      $(".hed-save").onclick = async function () {
        var btn = $(".hed-save");
        var h = fh(btn);
        if (!h) return;
        btn.disabled = true;
        btn.textContent = "Kaydediliyor…";
        h.t = $("#ed-ht").value;
        h.q = $("#ed-hq").value.trim();
        h.a = $("#ed-ha").value.trim();
        if ($("#ed-rm1") && $("#ed-rm1").checked) h.img = "";
        if ($("#ed-rm2") && $("#ed-rm2").checked) h.img2 = "";
        var nf1 = $("#ed-hp") && $("#ed-hp").files[0];
        var nf2 = $("#ed-hp2") && $("#ed-hp2").files[0];
        try {
          if (nf1) h.img = await upl(nf1);
          if (nf2) h.img2 = await upl(nf2);
        } catch (err) {
          showToast("Yeni fotoğraf işlenemedi");
        }
        EDIT_H_ID = "";
        save();
        showToast("Hata kaydı güncellendi");
        vSoruHata();
      };
    }

    v3.querySelectorAll(".hx").forEach(function (b) {
      b.onclick = function () {
        var h = fh(b);
        if (h && AS) {
          [h.img, h.img2].forEach(function (x) { if (x && x.indexOf("data:") !== 0) AS.delete(x).catch(function () {}); });
        }
        S.hd = S.hd.filter(function (x) { return x.id !== b.dataset.i; });
        save(); vSoruHata();
      };
    });

    bindBrokenImageHandlers(v3);
  }

  /* ==========================================================================
     13. AYARLAR SEKMESİ (PROFİL + 8 RENK PALETİ + YEDEKLEME + GİST SENKRON)
     ========================================================================== */
  var PALETTE_LIST = [
    ["cyan", "Turkuaz - Mor", "#22e3d0", "#9b6bff"],
    ["emerald", "Zümrüt - Altın", "#10b981", "#f59e0b"],
    ["sapphire", "Safir - Mavi", "#3b82f6", "#06b6d4"],
    ["ruby", "Yakut - Gül", "#f43f5e", "#ec4899"],
    ["amber", "Kehribar - Turuncu", "#f59e0b", "#ef4444"],
    ["ocean", "Okyanus - Camgöbeği", "#0ea5e9", "#14b8a6"],
    ["lavender", "Lavanta - İndigo", "#a855f7", "#6366f1"],
    ["mint", "Grafit - Mint", "#34d399", "#60a5fa"]
  ];

  function vAyar() {
    var c = S.cfg;
    var heavySet = new Set(c.heavySubjects || ["Tarih", "Matematik"]);

    var themeCard = "<div class='c'><h2>Görünüm ve Renk Paletleri (8 Seçenek)</h2>" +
      "<div class='seg'>" +
      "<button class='" + (c.theme === "dark" ? "on" : "") + "' data-th='dark'>Koyu Mod</button>" +
      "<button class='" + (c.theme === "light" ? "on" : "") + "' data-th='light'>Açık Mod</button>" +
      "</div>" +
      "<div class='n2'>" +
      PALETTE_LIST.map(function (p) {
        var active = c.palette === p[0];
        return "<button class='tb pal-btn' data-pal='" + p[0] + "' style='display:flex;align-items:center;justify-content:space-between;padding:9px 10px;" + (active ? "border-color:var(--ac);background:color-mix(in srgb,var(--ac) 12%,var(--bg))" : "") + "'>" +
          "<span style='font-size:13px;font-weight:" + (active ? "700" : "500") + "'>" + p[1] + "</span>" +
          "<span style='display:inline-flex;gap:4px'><i style='width:12px;height:12px;border-radius:50%;background:" + p[2] + "'></i><i style='width:12px;height:12px;border-radius:50%;background:" + p[3] + "'></i></span>" +
          "</button>";
      }).join("") +
      "</div></div>";

    var goalCard = "<div class='c'><h2>Profil, Hedefler ve Çalışma Temposu</h2>" +
      "<label>Adın / Hitap (Ana Sayfa karşılamasında görünür)</label>" +
      "<input id='cname' value='" + esc(c.name || "Enes") + "' placeholder='Örn. Enes'>" +
      "<div class='n3'>" +
      "<div><label>Hedef puan</label><input type='number' inputmode='decimal' id='cg' value='" + c.goal + "'></div>" +
      "<div><label>Günlük soru</label><input type='number' inputmode='numeric' id='cq' value='" + c.dq + "'></div>" +
      "<div><label>Sınav tarihi</label><input type='date' id='cd' value='" + esc(c.date) + "'></div>" +
      "</div>" +
      "<label>Günlük Çalışma Süresi Hedefi</label>" +
      "<select id='cdh'>" + [2, 2.5, 3, 3.5, 4, 4.5, 5, 5.5, 6, 7, 8].map(function (h) {
        return "<option value='" + h + "'" + (Number(c.dailyHours) === h ? " selected" : "") + ">" + h + " saat / gün</option>";
      }).join("") + "</select>" +
      "<label>Öncelikli / Ağır Ders Etiketleri</label>" +
      "<div class='chips'>" + Object.keys(S.ders).map(function (k) {
        var on = heavySet.has(k);
        return "<button class='tb hv-btn' data-k='" + esc(k) + "' style='" + (on ? "border-color:var(--ac2);color:var(--ac2)" : "opacity:0.55") + "'>" + (on ? "✓ " : "") + esc(k) + "</button>";
      }).join("") + "</div>" +
      "<small class='st' style='display:block;margin-top:6px'>Günlük plan kuralı: Her gün en fazla 2 farklı ders ve her dersten en fazla 1 tamamlanmamış konu planlanır.</small>" +
      "</div>";

    var backupCard = "<div class='c'><h2>Yedekleme ve Geri Yükleme (.json)</h2>" +
      "<small class='st' style='display:block;margin-bottom:8px'>Eski yedek dosyalarını yüklediğinde tüm soruların, denemelerin ve Hata Defteri fotoğrafların otomatik onarılır ve korunur.</small>" +
      "<div class='ctl'><button class='tb' id='bx'>Yedek İndir (.json)</button><button class='pb' id='bi' style='padding:9px'>Yedek Yükle (.json)</button></div>" +
      "<div class='st' id='bk-msg' style='margin-top:6px'></div>" +
      "<input type='file' id='bf' accept='.json,application/json' style='display:none'></div>";

    var syncCard = SA
      ? "<div class='c'><h2>Bulut Senkronu (GitHub Gist)</h2>" +
        (lsGet(GT)
          ? "<small class='st' id='gs'>Bağlı</small><div class='ctl'><button class='tb' id='gn'>Şimdi senkronla</button><button class='tb' id='gx'>Bağlantıyı kaldır</button></div>"
          : "<small class='st' style='display:block;margin-bottom:8px'>Cihazlar arası eşitleme için GitHub Gist token'ını gir (<a href='https://github.com/settings/tokens/new?scopes=gist&description=KPSS' target='_blank' style='color:var(--ac)'>token oluştur</a>):</small>" +
            "<input id='gt' placeholder='ghp_...' autocapitalize='off' autocomplete='off'><div style='height:10px'></div><button class='pb' id='gc'>Bağlan</button><small class='st' id='gs'></small>") +
        "</div>"
      : "";

    $("#v").innerHTML = themeCard + goalCard + backupCard + syncCard;

    var v = $("#v");
    v.querySelectorAll("[data-th]").forEach(function (b) {
      b.onclick = function () { S.cfg.theme = b.dataset.th; applyTheme(); save(); vAyar(); };
    });
    v.querySelectorAll(".pal-btn").forEach(function (b) {
      b.onclick = function () { S.cfg.palette = b.dataset.pal; applyTheme(); save(); vAyar(); };
    });

    var saveGoals = function () {
      S.cfg.name = $("#cname").value.trim() || "Enes";
      S.cfg.goal = Math.max(1, +$("#cg").value || 95);
      S.cfg.dq = Math.max(1, +$("#cq").value || 100);
      S.cfg.date = $("#cd").value;
      S.cfg.dailyHours = Number($("#cdh").value) || 4;
      save();
      showToast("Ayarlar kaydedildi");
    };
    ["cname", "cg", "cq", "cd", "cdh"].forEach(function (id) {
      $("#" + id).onchange = saveGoals;
    });

    v.querySelectorAll(".hv-btn").forEach(function (b) {
      b.onclick = function () {
        var cur = new Set(S.cfg.heavySubjects || []);
        if (cur.has(b.dataset.k)) cur.delete(b.dataset.k); else cur.add(b.dataset.k);
        S.cfg.heavySubjects = Array.from(cur);
        save();
        vAyar();
      };
    });

    if ($("#bx")) {
      $("#bx").onclick = function () {
        var a = document.createElement("a");
        a.href = URL.createObjectURL(new Blob([JSON.stringify(S)], { type: "application/json" }));
        a.download = "kpss-yedek-" + ds(new Date()) + ".json";
        a.click();
      };
    }
    if ($("#bi")) $("#bi").onclick = function () { $("#bf").click(); };
    if ($("#bf")) {
      $("#bf").onchange = function (e) {
        var g = e.target.files[0];
        if (!g) return;
        g.text().then(function (txt) {
          try {
            S = norm(JSON.parse(txt));
            S.ts = Date.now();
            applyTheme();
            save();
            render();
            var photoCount = S.hd.filter(function (h) { return h.img || h.img2; }).length;
            showToast("Yedek yüklendi (" + S.logs.length + " kayıt, " + photoCount + " fotoğraflı hata)");
          } catch (x) {
            if ($("#bk-msg")) $("#bk-msg").textContent = "Geçersiz yedek dosyası.";
          }
        });
      };
    }
    if ($("#gc")) {
      $("#gc").onclick = function () {
        var tok = $("#gt").value.trim();
        if (!tok) return;
        lsSet(GT, tok); lsSet(GI, null); lsSet(GS, null);
        vAyar(); gsync();
      };
    }
    if ($("#gn")) $("#gn").onclick = gsync;
    if ($("#gx")) {
      $("#gx").onclick = function () {
        lsSet(GT, null); lsSet(GI, null); lsSet(GS, null);
        status("Bu cihaz"); vAyar();
      };
    }
  }

  /* ==========================================================================
     14. ANA RENDER DÖNGÜSÜ VE PWA BAŞLATMA
     ========================================================================== */
  function render() {
    $("#nav").innerHTML = TOP.map(function (t) {
      return "<button class='" + (t[0] === tab ? "on" : "") + "' data-t='" + t[0] + "'>" + ic(t[0]) + "<span>" + t[1] + "</span></button>";
    }).join("");
    $("#nav").querySelectorAll("button").forEach(function (b) {
      b.onclick = function () {
        tab = b.dataset.t;
        render();
        window.scrollTo(0, 0);
      };
    });

    var views = {
      ozet: vOzet,
      analiz: vAnaliz,
      konu: vKonu,
      soru_hata: vSoruHata,
      ayar: vAyar
    };
    (views[tab] || vOzet)();
    updateHeaderTimer();
  }

  function initPWA() {
    try {
      var c = document.createElement("canvas");
      c.width = 512; c.height = 512;
      var ctx = c.getContext("2d");
      if (!ctx) return;
      ctx.fillStyle = "#07090e";
      ctx.fillRect(0, 0, 512, 512);
      ctx.beginPath();
      ctx.arc(256, 224, 132, 0, Math.PI * 2);
      ctx.lineWidth = 28;
      ctx.strokeStyle = "#1d2746";
      ctx.stroke();
      var grd = ctx.createLinearGradient(110, 90, 400, 360);
      grd.addColorStop(0, "#22e3d0");
      grd.addColorStop(1, "#9b6bff");
      ctx.beginPath();
      ctx.arc(256, 224, 132, -Math.PI / 2, Math.PI * 1.15);
      ctx.lineWidth = 28;
      ctx.lineCap = "round";
      ctx.strokeStyle = grd;
      ctx.stroke();
      ctx.fillStyle = "#f1f5f9";
      ctx.font = "bold 54px -apple-system, system-ui, sans-serif";
      ctx.textAlign = "center";
      ctx.fillText("KPSS", 256, 438);
      var iconUrl = c.toDataURL("image/png");
      if ($("#app-icon")) $("#app-icon").href = iconUrl;
      var manifest = {
        name: "KPSS Soru Takip",
        short_name: "KPSS Takip",
        start_url: ".",
        display: "standalone",
        background_color: "#07090e",
        theme_color: "#07090e",
        icons: [{ src: iconUrl, sizes: "512x512", type: "image/png" }]
      };
      if ($("#app-manifest")) $("#app-manifest").href = URL.createObjectURL(new Blob([JSON.stringify(manifest)], { type: "application/manifest+json" }));
    } catch (e) {}
  }

  window.onerror = function (msg) {
    var b = document.getElementById("err-banner");
    if (b) { b.style.display = "block"; b.textContent = "Hata: " + msg; }
  };

  try {
    $("#tm-open").onclick = function () { TM.open = !TM.open; renderTimerDrawer(); };
    $("#tm-disp").onclick = function () { TM.open = !TM.open; renderTimerDrawer(); };
    $("#tm-toggle").onclick = function () {
      if (TM.run) { TM.acc = tel(); TM.run = false; } else { TM.t0 = Date.now(); TM.run = true; }
      updateHeaderTimer();
      if (TM.open) renderTimerDrawer();
    };
    $("#tm-save").onclick = function () {
      var e = tel();
      if (TM.m === "sw" || TM.ph === "w") logFocus(e / 60);
      TM.run = false; TM.acc = 0; if (TM.m === "pom") TM.ph = "w";
      updateHeaderTimer();
      if (TM.open) renderTimerDrawer();
      render();
    };
    $("#cl0").onclick = function () { tab = "ayar"; render(); window.scrollTo(0, 0); };
    $("#th").onclick = function () {
      S.cfg.theme = S.cfg.theme === "dark" ? "light" : "dark";
      applyTheme();
      save();
      if (tab === "ayar") vAyar();
    };

    document.addEventListener("visibilitychange", function () { if (!document.hidden) gsync(); });
    window.addEventListener("focus", gsync);

    initPWA();
    render();
    status(lsGet(GT) ? "Senkron hazır" : "Bu cihaz");
    cloud();
    setTimeout(gsync, 300);
  } catch (err) {
    var b = document.getElementById("err-banner");
    if (b) { b.style.display = "block"; b.textContent = "Başlatma hatası: " + (err && err.message ? err.message : err); }
  }
})();
</script>
</body>
</html>
